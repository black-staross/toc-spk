at time does it start?", "questionKo": "중급 수영 영법 강습은 무슨 요일에 열리며, 몇 시에 시작하나요?", "sentences": [{"step": "1. 요일 및 시간 안내", "en": "The Intermediate Swimming Stroke class is held on Tuesdays and Thursdays at 6:30 PM.", "ko": "중급 수영 영법 강습은 화요일과 목요일 오후 6시 30분에 열립니다."}, {"step": "2. 장소 및 강사 안내", "en": "It takes place in Pool Lane 3 and 4, taught by Mark Davies.", "ko": "수영장 3~4번 레인에서 진행되며 마크 데이비스 강사가 지도합니다."}], "magicSentences": [{"en": "It is held on Tuesdays and Thursdays at 6:30 PM.", "ko": "화요일과 목요일 오후 6시 30분에 열립니다.", "tip": "시계토끼 만능 #103 & #106 (요일 시간 공식)"}], "vocabulary": [{"word": "intermediate", "ipa": "[ˌɪntərˈmiːdiət]", "pos": "형용사", "meaning": "중급의"}, {"word": "swimming stroke", "ipa": "[ˈswɪmɪŋ stroʊk]", "pos": "명사", "meaning": "수영 영법"}], "explanation": "두 번째 행의 'Tue & Thu', '06:30 PM', 'Pool Lane 3-4'를 완전한 문장으로 답변하세요."}, {"qId": "p4-s8-q9", "qNum": "Question 9", "topic": "금요일 HIIT 강습 시간 오류 정정", "prepTime": 3, "responseTime": 15, "question": "I would like to join the Friday High-Intensity Interval Training class. Does it start at 6:00 PM?", "questionKo": "금요일 고강도 인터벌 트레이닝(HIIT) 수업에 참여하고 싶습니다. 오후 6시에 시작하나요?", "sentences": [{"step": "1. 시간 오류 정정", "en": "No, I'm afraid that is not correct.", "ko": "아니요, 유감스럽지만 그것은 맞지 않습니다."}, {"step": "2. 정확한 시작 시각 안내", "en": "The Friday High-Intensity Interval Training class starts at 8:00 PM, not 6:00 PM.", "ko": "금요일 고강도 인터벌 트레이닝 수업은 오후 6시가 아니라 오후 8시에 시작합니다."}, {"step": "3. 장소 확인", "en": "It will take place in the Main Gym with instructor Mark Davies.", "ko": "메인 체육관에서 마크 데이비스 강사와 함께 진행될 예정입니다."}], "magicSentences": [{"en": "No, that is not correct. It starts at 8:00 PM, not 6:00 PM.", "ko": "아니요, 그렇지 않습니다. 6시가 아니라 8시에 시작합니다.", "tip": "시계토끼 만능 #114 (시각 정정 공식)"}], "vocabulary": [{"word": "high-intensity", "ipa": "[haɪ ɪnˈtensəti]", "pos": "형용사", "meaning": "고강도의"}, {"word": "interval training", "ipa": "[ˈɪntərvl ˈtreɪnɪŋ]", "pos": "명사", "meaning": "인터벌 훈련"}], "explanation": "표 세 번째 행의 Friday 수업 시간은 08:00 PM이므로 시간을 올바르게 정정하세요."}, {"qId": "p4-s8-q10", "qNum": "Question 10", "topic": "클로이 베넷(Chloe Bennett) 강사가 지도하는 모든 강습 2가지 상세 안내", "prepTime": 3, "responseTime": 30, "question": "I am a big fan of Chloe Bennett's fitness classes. Could you tell me all the classes she will be teaching?", "questionKo": "저는 클로이 베넷 강사의 피트니스 수업 팬입니다. 그녀가 지도할 모든 강습을 알려주실 수 있나요?", "sentences": [{"step": "1. 총 개수 안내", "en": "Sure! There are two classes taught by Chloe Bennett.", "ko": "물론입니다! 클로이 베넷이 가르치는 수업은 두 개가 있습니다."}, {"step": "2. 첫 번째 강습 (평일 요가)", "en": "First, on Mondays and Wednesdays at 7:00 AM, she teaches Morning Yoga and Stretching in Studio A.", "ko": "첫째, 월요일과 수요일 오전 7시에 스튜디오 A에서 아침 요가 및 스트레칭을 가르칩니다."}, {"step": "3. 두 번째 강습 (주말 필라테스)", "en": "Second, on Saturdays at 10:00 AM, she leads Weekend Pilates for Beginners in Studio B.", "ko": "둘째, 토요일 오전 10시에는 스튜디오 B에서 초보자를 위한 주말 필라테스를 진행합니다."}], "magicSentences": [{"en": "There are two classes taught by Chloe Bennett.", "ko": "클로이 베넷이 지도하는 수업이 두 개 있습니다.", "tip": "시계토끼 만능 #129 (강사별 강습 요약)"}, {"en": "First, on Mondays and Wednesdays... Second, on Saturdays...", "ko": "첫째 월수에는... 둘째 토요일에는...", "tip": "시계토끼 만능 #131 (요일 순차 안내)"}], "vocabulary": [{"word": "stretching", "ipa": "[ˈstretʃɪŋ]", "pos": "명사", "meaning": "스트레칭"}, {"word": "beginners", "ipa": "[bɪˈɡɪnərz]", "pos": "명사", "meaning": "초보자들"}], "explanation": "첫 번째 행(월수 아침 요가)과 네 번째 행(토요일 오전 초보자 필라테스) 두 수업의 요일, 시간, 스튜디오를 차례로 설명하세요."}, {"qId": "p4-s8-q-extra", "qNum": "추가 문제 (수강료 및 할인)", "topic": "월 수강료, 학생 할인 혜택 및 락커 이용료 안내", "prepTime": 3, "responseTime": 15, "question": "How much is the monthly tuition fee, and is there any discount available for students?", "questionKo": "월 수강료는 얼마이며, 학생을 위한 할인 혜택이 있나요?", "sentences": [{"step": "1. 수강료 및 학생 할인 안내", "en": "The monthly tuition is $70, and students can receive a 20% discount.", "ko": "월 수강료는 70달러이며, 학생은 20% 할인을 받을 수 있습니다."}, {"step": "2. 락커 이용료 추가 안내", "en": "Also, an optional personal locker is available for an additional fee of $10 per month.", "ko": "또한 개인 락커는 월 10달러의 추가 비용으로 이용하실 수 있습니다."}], "magicSentences": [{"en": "The monthly tuition is 70 dollars, and students receive a 20% discount.", "ko": "월 수강료는 70달러이며 학생은 20% 할인을 받습니다.", "tip": "시계토끼 만능 #123 (수강료 및 할인 공식)"}], "vocabulary": [{"word": "tuition", "ipa": "[tuˈɪʃn]", "pos": "명사", "meaning": "수강료"}, {"word": "personal locker", "ipa": "[ˈpɜːrsənl ˈlɑːkər]", "pos": "명사", "meaning": "개인 사물함"}], "explanation": "상단의 '$70 per month', '20% discount for students', 'Locker fee: $10'을 완전한 문장으로 설명하세요."}]}], "part5": [{"id": "p5-01", "part": 5, "qNum": "#01", "category": "일상·라이프스타일", "topic": "전자책(E-books)이 미래에 종이책을 완전히 대체할 것인가?", "prepTime": 45, "responseTime": 60, "question": "Do you agree or disagree with the following statement? E-books will completely replace paper books in the near future. Give specific reasons and examples to support your opinion.", "questionKo": "다음 진술에 동의하십니까, 반대하십니까? '가까운 미래에 전자책이 종이책을 완전히 대체할 것이다.' 구체적인 이유와 예시를 들어 의견을 뒷받침하시오.", "sentences": [{"step": "1. 서론 (찬성 입장)", "en": "I strongly agree with the statement that e-books will completely replace paper books in the near future.", "ko": "저는 가까운 미래에 전자책이 종이책을 완전히 대체할 것이라는 진술에 강력히 동의합니다."}, {"step": "2. 본론 1 (휴대성·편리성)", "en": "First of all, e-books are much more portable and convenient than heavy paper books.", "ko": "무엇보다도 전자책은 무거운 종이책보다 훨씬 휴대성이 뛰어나고 편리합니다."}, {"step": "3. 본론 1 부연", "en": "People can store hundreds of books on a single tablet or smartphone and read them anytime, anywhere while commuting.", "ko": "사람들은 태블릿이나 스마트폰 하나에 수백 권의 책을 저장해 두고 출퇴근하면서 언제 어디서나 읽을 수 있습니다."}, {"step": "4. 본론 2 (비용·환경 보호)", "en": "Second, reading e-books is economical and eco-friendly because it saves printing costs and reduces paper waste.", "ko": "둘째, 전자책을 읽는 것은 인쇄 비용을 아끼고 종이 쓰레기를 줄여주기 때문에 경제적이면서도 친환경적입니다."}, {"step": "5. 개인 경험 예시", "en": "For example, since I bought a tablet last year, I have only downloaded e-books because they are 30 percent cheaper and don't take up space in my room.", "ko": "예를 들어 저는 작년에 태블릿을 산 이후로 가격이 30% 더 저렴하고 방 공간을 차지하지 않는 전자책만 다운로드해서 읽고 있습니다."}, {"step": "6. 결론 재강조", "en": "For these reasons, I firmly believe that e-books will eventually replace traditional paper books.", "ko": "이러한 이유들로 저는 전자책이 결국 전통적인 종이책을 대체할 것이라고 확신합니다."}], "magicSentences": [{"en": "People can read them anytime, anywhere with their smartphones.", "ko": "스마트폰으로 언제 어디서나 읽을 수 있습니다.", "tip": "시계토끼 만능 #158 (디지털 기술 찬성 핵심)"}, {"en": "It is eco-friendly because it reduces paper waste and protects the environment.", "ko": "종이 낭비를 줄이고 환경을 보호하므로 친환경적입니다.", "tip": "시계토끼 만능 #175 (환경 보호 만능문장)"}], "vocabulary": [{"word": "replace", "ipa": "[rɪˈpleɪs]", "pos": "동사", "meaning": "대체하다"}, {"word": "portable", "ipa": "[ˈpɔːrtəbl]", "pos": "형용사", "meaning": "휴대하기 편한"}, {"word": "economical", "ipa": "[ˌiːkəˈnɑːmɪkl]", "pos": "형용사", "meaning": "경제적인, 비용이 적게 드는"}, {"word": "take up space", "ipa": "[teɪk ʌp speɪs]", "pos": "숙어", "meaning": "공간을 차지하다"}], "explanation": "2026년 11월 기출 문제입니다. 종이 vs 디지털(전자책, 모바일 신문, 전자 영수증) 주제는 1) 휴대성·시공간 자유(anytime, anywhere) + 2) 비용 절감 및 친환경(save money & eco-friendly) 두 가지로 답하면 60초 분량이 완벽하게 채워집니다."}, {"id": "p5-02", "part": 5, "qNum": "#02", "category": "직장·리더십", "topic": "뛰어난 리더가 되기 위해 가장 중요한 자질 (경청 vs 카리스마)", "prepTime": 45, "responseTime": 60, "question": "What do you think is the most important quality of a good leader: listening to employees' opinions or making quick decisions on their own? Explain your answer with specific reasons.", "questionKo": "좋은 리더의 가장 중요한 자질은 무엇이라고 생각합니까? (직원들의 의견 경청하기 vs 스스로 신속하게 의사결정 내리기)", "sentences": [{"step": "1. 서론 (선택 제시)", "en": "I definitely think that listening to employees' opinions is the most important quality of a good leader.", "ko": "저는 직원들의 의견을 경청하는 것이 좋은 리더의 가장 중요한 자질이라고 확실히 생각합니다."}, {"step": "2. 본론 1 (신뢰·팀워크)", "en": "First of all, open communication builds strong trust and teamwork within the company.", "ko": "무엇보다도 열린 소통은 회사 내에서 끈끈한 신뢰와 팀워크를 구축해 줍니다."}, {"step": "3. 본론 1 부연", "en": "When a leader respects team members' ideas, employees feel valued and become more motivated to work hard.", "ko": "리더가 팀원들의 아이디어를 존중할 때 직원들은 존중받는다고 느끼고 더 열심히 일하려는 동기를 얻게 됩니다."}, {"step": "4. 본론 2 (창의적 해결책)", "en": "Second, by gathering diverse perspectives from employees, a leader can come up with more creative solutions and avoid costly mistakes.", "ko": "둘째, 직원들로부터 다양한 관점을 수렴함으로써 리더는 더 창의적인 해결책을 떠올리고 큰 실수를 피할 수 있습니다."}, {"step": "5. 구체적 예시", "en": "For example, my former manager always held weekly feedback sessions, which helped our team increase sales by 20 percent.", "ko": "예를 들어 저의 이전 매니저님은 항상 주간 피드백 회의를 열어 팀원의 의견을 들었고, 그 덕분에 팀 매출을 20% 늘릴 수 있었습니다."}, {"step": "6. 결론 마무리", "en": "Therefore, I believe listening to employees is the key to becoming a successful leader.", "ko": "따라서 저는 직원들의 말에 귀 기울이는 것이 성공적인 리더가 되는 핵심 열쇠라고 믿습니다."}], "magicSentences": [{"en": "It builds strong trust and improves teamwork among employees.", "ko": "직원들 간의 강한 신뢰를 쌓고 팀워크를 향상시킵니다.", "tip": "시계토끼 만능 #147 & #148 (리더십·조직문화 만능문장)"}, {"en": "Employees feel valued and become more motivated to work hard.", "ko": "직원들이 존중받는다고 느끼며 열심히 일할 동기를 얻습니다.", "tip": "시계토끼 만능 #145 (동기부여 만능문장)"}], "vocabulary": [{"word": "quality", "ipa": "[ˈkwɑːləti]", "pos": "명사", "meaning": "자질, 덕목"}, {"word": "feel valued", "ipa": "[fiːl ˈvæljuːd]", "pos": "숙어", "meaning": "존중받는다고 느끼다"}, {"word": "perspective", "ipa": "[pərˈspektɪv]", "pos": "명사", "meaning": "관점, 시각"}, {"word": "come up with", "ipa": "[kʌm ʌp wɪð]", "pos": "숙어", "meaning": "(아이디어·해결책을) 떠올리다"}], "explanation": "리더십/매니저의 자질을 묻는 파트 5 문제는 항상 '소통·경청(listening & communication)'을 선택하세요. 신뢰 구축(build trust) + 동기부여(motivate employees) + 다양한 아이디어(creative ideas) 3단 공식이 만능으로 적용됩니다."}, {"id": "p5-03", "part": 5, "qNum": "#03", "category": "기술·인공지능(AI)", "topic": "업무 및 학습에서 인공지능(AI) 도구 활용의 긍정적 영향", "prepTime": 45, "responseTime": 60, "question": "Nowadays, many people use AI tools for their work and studies. Do you think this is a positive or negative trend? Support your response with specific reasons and examples.", "questionKo": "오늘날 많은 사람들이 업무와 학업에 AI 도구를 사용합니다. 이것이 긍정적인 추세라고 생각합니까, 부정적인 추세라고 생각합니까?", "sentences": [{"step": "1. 서론 (긍정 입장)", "en": "I strongly believe that using AI tools for work and studies is a very positive trend.", "ko": "저는 업무와 학업에 AI 도구를 사용하는 것이 매우 긍정적인 추세라고 강력히 믿습니다."}, {"step": "2. 본론 1 (시간 절약·생산성)", "en": "First of all, AI tools help people save a tremendous amount of time and increase work productivity.", "ko": "무엇보다도 AI 도구는 사람들이 엄청난 시간을 절약하고 업무 생산성을 높이도록 도와줍니다."}, {"step": "3. 본론 1 부연", "en": "Workers can quickly summarize long documents, translate foreign languages, and analyze data in just a few seconds.", "ko": "직장인들은 단 몇 초 만에 긴 문서를 요약하고 외국어를 번역하며 데이터를 분석할 수 있습니다."}, {"step": "4. 본론 2 (맞춤형 학습)", "en": "Second, for students, AI acts as a personal tutor available 24 hours a day, helping them understand difficult concepts easily.", "ko": "둘째, 학생들에게 AI는 하루 24시간 이용 가능한 개인 튜터 역할을 하여 어려운 개념을 쉽게 이해하도록 도와줍니다."}, {"step": "5. 개인 경험 예시", "en": "For instance, I use an AI tool at my office to draft English emails, and it has cut my working time in half.", "ko": "예를 들어 저는 사무실에서 영문 이메일 초안을 작성할 때 AI 도구를 사용하는데, 덕분에 업무 시간이 절반으로 줄었습니다."}, {"step": "6. 결론 마무리", "en": "For these reasons, I think using AI technology brings great benefits to our daily lives.", "ko": "이러한 이유로 저는 AI 기술을 활용하는 것이 우리 일상에 큰 혜택을 가져다준다고 생각합니다."}], "magicSentences": [{"en": "It helps people save a lot of time and increase work productivity.", "ko": "많은 시간을 절약하고 업무 생산성을 높이는 데 도움이 됩니다.", "tip": "시계토끼 만능 #141 & #142 (기술·IT 찬성 1순위 문장)"}, {"en": "People can get useful information in just a few seconds.", "ko": "단 몇 초 만에 유용한 정보를 얻을 수 있습니다.", "tip": "시계토끼 만능 #156 (인터넷·AI 정보 검색 장점)"}], "vocabulary": [{"word": "tremendous", "ipa": "[trəˈmendəs]", "pos": "형용사", "meaning": "엄청난, 막대한"}, {"word": "summarize", "ipa": "[ˈsʌməraɪz]", "pos": "동사", "meaning": "요약하다"}, {"word": "concept", "ipa": "[ˈkɑːnsept]", "pos": "명사", "meaning": "개념"}, {"word": "cut in half", "ipa": "[kʌt ɪn hæf]", "pos": "숙어", "meaning": "절반으로 줄이다"}], "explanation": "2026년 하반기 최빈출 토픽인 AI·자동화·신기술 문제는 무조건 'Positive(긍정)'를 선택하고 'save time(시간 절약)' + 'increase productivity(생산성 향상)' + '영문 이메일 작성 예시'를 말하면 AL(160~180점)을 받을 수 있습니다."}, {"id": "p5-04", "part": 5, "qNum": "#04", "category": "직장·근무환경", "topic": "유연근무제 및 주 4일제/재택근무 도입 찬반", "prepTime": 45, "responseTime": 60, "question": "Do you agree or disagree that companies should allow employees to have flexible working hours or work from home? Give specific reasons to support your opinion.", "questionKo": "기업들이 직원들에게 유연근무제나 재택근무를 허용해야 한다는 의견에 동의하십니까, 반대하십니까?", "sentences": [{"step": "1. 서론 (찬성 입장)", "en": "I completely agree that companies should allow employees to have flexible working hours and work from home.", "ko": "저는 기업들이 직원들에게 유연근무제와 재택근무를 허용해야 한다는 의견에 전적으로 동의합니다."}, {"step": "2. 본론 1 (통근 스트레스 해소)", "en": "First, employees can save commuting time and avoid stressful traffic jams during rush hour.", "ko": "첫째, 직원들은 출퇴근 시간을 절약하고 러시아워의 스트레스 받는 교통 체증을 피할 수 있습니다."}, {"step": "3. 본론 1 부연", "en": "Instead of wasting two hours on the road every day, they can use that time to rest or exercise.", "ko": "매일 길 위에서 두 시간을 낭비하는 대신 그 시간을 휴식을 취하거나 운동하는 데 쓸 수 있습니다."}, {"step": "4. 본론 2 (워라밸 및 애사심)", "en": "Second, it greatly improves employees' work-life balance and job satisfaction, which reduces employee turnover.", "ko": "둘째, 직원들의 워라밸과 직무 만족도를 크게 높여주어 직원 이직률을 낮춰줍니다."}, {"step": "5. 구체적 예시", "en": "For example, after my company introduced flexible working hours last year, employees became much happier and overall productivity increased.", "ko": "예를 들어 저희 회사가 작년에 유연근무제를 도입한 이후 직원들이 훨씬 행복해졌고 전반적인 생산성도 향상되었습니다."}, {"step": "6. 결론 마무리", "en": "Therefore, flexible working policies are beneficial for both employees and companies.", "ko": "따라서 유연한 근무 정책은 직원과 회사 모두에게 유익합니다."}], "magicSentences": [{"en": "It greatly improves employees' work-life balance and job satisfaction.", "ko": "직원들의 워라밸과 직무 만족도를 크게 향상시킵니다.", "tip": "시계토끼 만능 #143 & #144 결합"}, {"en": "Happy employees can focus better and increase overall productivity.", "ko": "행복한 직원들은 더 잘 집중할 수 있고 전체 생산성을 높입니다.", "tip": "시계토끼 만능 #141 (직장 복지 찬성 결론)"}], "vocabulary": [{"word": "flexible working hours", "ipa": "[ˈfleksəbl ˈwɜːrkɪŋ ˈaʊərz]", "pos": "명사구", "meaning": "유연근무제, 탄력근무 시간"}, {"word": "job satisfaction", "ipa": "[dʒɑːb ˌsætɪsˈfækʃn]", "pos": "명사", "meaning": "직무 만족도"}, {"word": "employee turnover", "ipa": "[ɪmˈplɔɪiː ˈtɜːrnoʊvər]", "pos": "명사", "meaning": "직원 이직률"}, {"word": "beneficial", "ipa": "[ˌbenɪˈfɪʃl]", "pos": "형용사", "meaning": "유익한, 이로운"}], "explanation": "사내 복지·유연근무·휴가 확대 주제는 언제나 '통근 피로 감소(save commuting time)' -> '워라밸 및 직무 만족도 상승(job satisfaction)' -> '생산성 향상 및 이직률 감소(increase productivity)'로 연결하세요."}, {"id": "p5-05", "part": 5, "qNum": "#05", "category": "직업·커리어 선택", "topic": "직장을 선택할 때 높은 연봉(High Salary) vs 많은 휴가·여가 시간", "prepTime": 45, "responseTime": 60, "question": "When choosing a job, which do you think is more important: a high salary or plenty of vacation time? Use specific reasons and examples to support your choice.", "questionKo": "직장을 선택할 때 높은 연봉과 충분한 휴가 기간 중 어느 것이 더 중요하다고 생각합니까?", "sentences": [{"step": "1. 서론 (높은 연봉 선택)", "en": "When choosing a job, I definitely think a high salary is more important than plenty of vacation time.", "ko": "직장을 선택할 때 저는 충분한 휴가 기간보다 높은 연봉이 확실히 더 중요하다고 생각합니다."}, {"step": "2. 본론 1 (생계비 및 경제적 안정)", "en": "First of all, the cost of living is rising rapidly these days, so financial stability is essential for a happy life.", "ko": "무엇보다도 요즘 물가(생활비)가 빠르게 오르고 있어서 행복한 삶을 위해서는 경제적 안정이 필수적입니다."}, {"step": "3. 본론 1 부연", "en": "Even if I have a lot of vacation days, I cannot travel abroad or enjoy hobbies if I am on a tight budget.", "ko": "아무리 휴가 일수가 많더라도 예산이 빠듯하면 해외여행을 가거나 취미 생활을 즐길 수 없습니다."}, {"step": "4. 본론 2 (강력한 동기부여)", "en": "Second, a high salary is the strongest motivation for employees to work hard and achieve their goals.", "ko": "둘째, 높은 연봉은 직원들이 열심히 일하고 목표를 달성하게 만드는 가장 강력한 동기부여입니다."}, {"step": "5. 개인 예시", "en": "For example, when I received a salary raise and bonus last year, I felt strongly rewarded and worked with much greater passion.", "ko": "예를 들어 제가 작년에 연봉 인상과 보너스를 받았을 때 큰 보상을 받았다고 느꼈고 훨씬 더 큰 열정을 가지고 일했습니다."}, {"step": "6. 결론 마무리", "en": "For these reasons, I believe a high salary is the most important factor when choosing a job.", "ko": "이러한 이유들로 저는 직업을 선택할 때 높은 연봉이 가장 중요한 요소라고 믿습니다."}], "magicSentences": [{"en": "Financial stability is essential because the cost of living is rising.", "ko": "생활비가 오르고 있기 때문에 경제적 안정은 필수적입니다.", "tip": "시계토끼 만능 #151 (연봉·급여 선택 1순위 논리)"}, {"en": "A high salary is the strongest motivation to work hard.", "ko": "높은 연봉은 열심히 일하게 하는 가장 강력한 동기부여입니다.", "tip": "시계토끼 만능 #152 (금전적 보상 효과)"}], "vocabulary": [{"word": "cost of living", "ipa": "[kɔːst ʌv ˈlɪvɪŋ]", "pos": "명사", "meaning": "생활비, 물가"}, {"word": "financial stability", "ipa": "[faɪˈnænʃl stəˈbɪləti]", "pos": "명사", "meaning": "경제적 안정"}, {"word": "on a tight budget", "ipa": "[ɑːn ə taɪt ˈbʌdʒɪt]", "pos": "숙어", "meaning": "예산이 빠듯한"}, {"word": "rewarded", "ipa": "[rɪˈwɔːrdɪd]", "pos": "분사/형용사", "meaning": "보상받은"}], "explanation": "연봉(High salary) vs 워라밸/적성/동료 비교 문제에서는 연봉을 선택해 '물가 상승으로 인한 경제적 안정(cost of living & financial stability)'과 '돈이 있어야 여가도 즐길 수 있음'을 말하면 논리가 매우 탄탄해집니다."}, {"id": "p5-06", "part": 5, "qNum": "#06", "category": "교육·학습", "topic": "학교 및 직무 교육에서 팀 프로젝트(Group Work) vs 개인 과제(Individual Work)", "prepTime": 45, "responseTime": 60, "question": "Do you think it is better for students and employees to work on group projects or work individually? Give specific reasons and examples to support your opinion.", "questionKo": "학생들과 직장인들이 그룹 프로젝트를 하는 것과 개인별로 과제를 하는 것 중 어느 쪽이 더 낫다고 생각합니까?", "sentences": [{"step": "1. 서론 (그룹 프로젝트 선택)", "en": "I strongly believe that working on group projects is much better than working individually.", "ko": "저는 그룹 프로젝트를 하는 것이 개인별로 일하는 것보다 훨씬 더 낫다고 강력히 믿습니다."}, {"step": "2. 본론 1 (다양한 아이디어 및 문제 해결)", "en": "First of all, people can share diverse ideas and solve complex problems much faster together.", "ko": "무엇보다도 사람들이 다양한 아이디어를 공유하고 복잡한 문제를 함께 훨씬 더 빠르게 해결할 수 있습니다."}, {"step": "3. 본론 1 부연", "en": "By dividing the workload according to each member's strengths, the team can achieve better results in less time.", "ko": "각 구성원의 강점에 따라 업무량을 분담함으로써 팀은 더 짧은 시간에 더 나은 결과를 달성할 수 있습니다."}, {"step": "4. 본론 2 (사회성·소통 능력)", "en": "Second, working in a group helps people develop communication skills, teamwork, and responsibility.", "ko": "둘째, 그룹으로 일하는 것은 사람들이 의사소통 능력, 팀워크, 그리고 책임감을 기르는 데 도움이 됩니다."}, {"step": "5. 개인 경험 예시", "en": "For example, when I prepared a marketing presentation with three teammates last month, we combined our ideas and won first prize.", "ko": "예를 들어 지난달에 세 명의 팀원과 함께 마케팅 발표를 준비했을 때 저희의 아이디어를 결합해 1등 상을 받았습니다."}, {"step": "6. 결론 마무리", "en": "Therefore, I think group projects are far more effective than working alone.", "ko": "따라서 저는 그룹 프로젝트가 혼자 일하는 것보다 훨씬 더 효과적이라고 생각합니다."}], "magicSentences": [{"en": "People can share diverse ideas and solve problems faster together.", "ko": "다양한 아이디어를 공유하고 문제를 함께 더 빨리 해결할 수 있습니다.", "tip": "시계토끼 만능 #163 (팀워크·그룹 활동 찬성 공식)"}, {"en": "It helps people develop communication skills and teamwork.", "ko": "의사소통 기술과 팀워크를 기르는 데 도움이 됩니다.", "tip": "시계토끼 만능 #164 (협업 교육 효과)"}], "vocabulary": [{"word": "individually", "ipa": "[ˌɪndɪˈvɪdʒuəli]", "pos": "부사", "meaning": "개별적으로, 혼자서"}, {"word": "workload", "ipa": "[ˈwɜːrkloʊd]", "pos": "명사", "meaning": "업무량"}, {"word": "strengths", "ipa": "[streŋkθs]", "pos": "명사", "meaning": "강점, 장점"}, {"word": "communication skills", "ipa": "[kəˌmjuːnɪˈkeɪʃn skɪlz]", "pos": "명사", "meaning": "의사소통 능력"}], "explanation": "팀 프로젝트 vs 개인 과제 주제는 파트 3와 파트 5 모두에서 단골로 출제됩니다. '아이디어 공유 및 업무 분담(share ideas & divide the workload)' + '소통 능력 및 협동심 함양(communication skills & teamwork)' 두 가지를 기억하세요."}, {"id": "p5-07", "part": 5, "qNum": "#07", "category": "비즈니스·마케팅", "topic": "기업 홍보에서 소셜 미디어(SNS) 마케팅 vs 전통 TV·신문 광고", "prepTime": 45, "responseTime": 60, "question": "Which do you think is a more effective way for companies to advertise their new products: social media marketing or traditional television commercials? Explain why.", "questionKo": "기업이 신제품을 광고할 때 소셜 미디어 마케팅과 전통적인 TV 광고 중 어느 것이 더 효과적인 방법이라고 생각합니까?", "sentences": [{"step": "1. 서론 (소셜 미디어 선택)", "en": "I definitely think social media marketing is a much more effective way to advertise new products than television commercials.", "ko": "저는 신제품을 광고할 때 소셜 미디어 마케팅이 TV 광고보다 훨씬 더 효과적인 방법이라고 확실히 생각합니다."}, {"step": "2. 본론 1 (저비용 고효율)", "en": "First, social media advertising is much more cost-effective, especially for small businesses with a limited budget.", "ko": "첫째, 소셜 미디어 광고는 비용 대비 효율이 훨씬 뛰어나며, 특히 예산이 제한된 소규모 기업에 유리합니다."}, {"step": "3. 본론 2 (타겟팅 및 확산성)", "en": "Second, companies can target specific age groups and interests, and viral videos can reach millions of users worldwide in seconds.", "ko": "둘째, 기업들이 특정 연령대와 관심사를 타겟팅할 수 있고, 입소문 영상은 단 몇 초 만에 전 세계 수백만 명의 사용자에게 도달할 수 있습니다."}, {"step": "4. 본론 2 부연 (스마트폰 사용)", "en": "Nowadays, people spend much more time looking at their smartphones than watching TV.", "ko": "오늘날 사람들은 TV를 보는 시간보다 스마트폰을 보는 데 훨씬 더 많은 시간을 보냅니다."}, {"step": "5. 개인 경험 예시", "en": "For example, I recently bought a new cosmetic product right after watching a short review video on Instagram.", "ko": "예를 들어 저도 최근에 인스타그램에서 짧은 리뷰 영상을 본 직후에 바로 새로운 화장품을 구매했습니다."}, {"step": "6. 결론 마무리", "en": "For these reasons, social media marketing is the most powerful advertising tool today.", "ko": "이러한 이유로 소셜 미디어 마케팅은 오늘날 가장 강력한 광고 수단입니다."}], "magicSentences": [{"en": "It is much more cost-effective and saves advertising costs.", "ko": "비용 대비 효율이 훨씬 뛰어나고 광고비를 절약해 줍니다.", "tip": "시계토끼 만능 #169 (마케팅·비즈니스 비용 효율 문장)"}, {"en": "People spend a lot of time on their smartphones every day.", "ko": "사람들은 매일 스마트폰에 많은 시간을 소비합니다.", "tip": "시계토끼 만능 #159 (모바일·SNS 트렌드 근거)"}], "vocabulary": [{"word": "cost-effective", "ipa": "[ˌkɔːst ɪˈfektɪv]", "pos": "형용사", "meaning": "비용 대비 효과가 뛰어난, 가성비 좋은"}, {"word": "commercials", "ipa": "[kəˈmɜːrʃlz]", "pos": "명사", "meaning": "(TV·라디오) 상업 광고"}, {"word": "viral", "ipa": "[ˈvaɪrəl]", "pos": "형용사", "meaning": "입소문이 퍼지는, 바이럴의"}, {"word": "target", "ipa": "[ˈtɑːrɡɪt]", "pos": "동사", "meaning": "겨냥하다, 타겟으로 삼다"}], "explanation": "비즈니스/마케팅 광고 수단 비교 문제에서는 'Social Media Marketing'을 선택하면 가성비(cost-effective), 스마트폰 사용 시간(spend time on smartphones), 즉각적 구매 연결(Instagram 예시)을 자연스럽게 말할 수 있습니다."}, {"id": "p5-08", "part": 5, "qNum": "#08", "category": "아동·청소년 교육", "topic": "아이들에게 어릴 때부터 외국어(영어)나 경제 관념을 가르치는 것에 대한 찬반", "prepTime": 45, "responseTime": 60, "question": "Do you agree or disagree that children should start learning a foreign language as early as possible? Support your opinion with specific reasons and examples.", "questionKo": "아이들이 가능한 한 일찍부터 외국어를 배우기 시작해야 한다는 의견에 동의하십니까, 반대하십니까?", "sentences": [{"step": "1. 서론 (찬성 입장)", "en": "I strongly agree that children should start learning a foreign language as early as possible.", "ko": "저는 아이들이 가능한 한 일찍 외국어를 배우기 시작해야 한다는 의견에 강력히 동의합니다."}, {"step": "2. 본론 1 (빠른 흡수력 및 발음)", "en": "First of all, young children have flexible brains, so they can absorb new words and natural pronunciation much faster than adults.", "ko": "무엇보다도 어린아이들은 두뇌가 유연해서 성인보다 새로운 단어와 자연스러운 발음을 훨씬 더 빠르게 흡수할 수 있습니다."}, {"step": "3. 본론 1 부연", "en": "Also, they are not afraid of making mistakes, which helps them gain confidence in speaking.", "ko": "또한 실수하는 것을 두려워하지 않기 때문에 말하기에 대한 자신감을 얻는 데 도움이 됩니다."}, {"step": "4. 본론 2 (글로벌 경쟁력)", "en": "Second, in this globalized world, being fluent in a foreign language will give them more career opportunities in the future.", "ko": "둘째, 이 세계화된 시대에서 외국어에 능통한 것은 미래에 아이들에게 더 많은 직업적 기회를 줄 것입니다."}, {"step": "5. 구체적 예시", "en": "For example, my nephew started watching English cartoons at age five, and now he speaks English fluently without stress.", "ko": "예를 들어 제 조카는 다섯 살 때부터 영어 만화를 보기 시작했는데 지금은 스트레스 없이 영어를 유창하게 구사합니다."}, {"step": "6. 결론 마무리", "en": "Therefore, early foreign language education is very beneficial for children's future.", "ko": "따라서 조기 외국어 교육은 아이들의 미래에 매우 유익합니다."}], "magicSentences": [{"en": "Children can absorb new knowledge much faster than adults.", "ko": "아이들은 성인보다 새로운 지식을 훨씬 더 빨리 흡수할 수 있습니다.", "tip": "시계토끼 만능 #166 (아동 조기 교육 찬성 1순위 문장)"}, {"en": "It will give them more opportunities in the future.", "ko": "미래에 그들에게 더 많은 기회를 줄 것입니다.", "tip": "시계토끼 만능 #168 (교육의 미래 가치 만능문장)"}], "vocabulary": [{"word": "absorb", "ipa": "[əbˈzɔːrb]", "pos": "동사", "meaning": "(지식·언어를) 흡수하다, 습득하다"}, {"word": "pronunciation", "ipa": "[prəˌnʌnsiˈeɪʃn]", "pos": "명사", "meaning": "발음"}, {"word": "globalized", "ipa": "[ˈɡloʊbəlaɪzd]", "pos": "형용사", "meaning": "세계화된"}, {"word": "nephew", "ipa": "[ˈnefjuː]", "pos": "명사", "meaning": "조카"}], "explanation": "아이들(Children)에게 외국어, 코딩, 악기, 경제 관념 등을 일찍 가르쳐야 하는가? 하는 질문은 모두 '어릴수록 흡수가 빠르고 좋은 습관이 형성됨(absorb faster)' + '미래에 큰 자산이 됨(great asset in the future)'으로 답하면 됩니다."}, {"id": "p5-09", "part": 5, "qNum": "#09", "category": "환경·사회 정책", "topic": "정부의 일회용 플라스틱 사용 규제 및 대중교통 장려 정책 찬반", "prepTime": 45, "responseTime": 60, "question": "Do you agree or disagree that the government should strictly restrict the use of disposable plastic products in cafes and supermarkets? Give specific reasons.", "questionKo": "정부가 카페와 대형 마트에서 일회용 플라스틱 제품의 사용을 엄격히 제한해야 한다는 의견에 동의하십니까?", "sentences": [{"step": "1. 서론 (찬성 입장)", "en": "I strongly agree that the government should strictly restrict the use of disposable plastic products.", "ko": "저는 정부가 일회용 플라스틱 제품의 사용을 엄격히 제한해야 한다는 의견에 강력히 동의합니다."}, {"step": "2. 본론 1 (환경 오염 심각성)", "en": "First of all, plastic waste takes hundreds of years to break down and causes serious environmental pollution.", "ko": "무엇보다도 플라스틱 쓰레기는 분해되는 데 수백 년이 걸리며 심각한 환경 오염을 유발합니다."}, {"step": "3. 본론 2 (강제 규제의 필요성)", "en": "Second, although many people know the importance of protecting the environment, they still use disposable cups out of habit.", "ko": "둘째, 많은 사람들이 환경 보호의 중요성을 알고 있음에도 불구하고 습관적으로 일회용 컵을 사용합니다."}, {"step": "4. 본론 2 부연", "en": "However, strong government regulations encourage citizens to bring their own reusable tumblers and eco-bags.", "ko": "하지만 강력한 정부 규제는 시민들이 개인 다회용 텀블러와 에코백을 지참하도록 장려합니다."}, {"step": "5. 개인 경험 예시", "en": "For example, after plastic bags were banned at supermarkets in Korea, carrying an eco-bag became a natural daily habit for everyone.", "ko": "예를 들어 한국 대형 마트에서 비닐봉지가 금지된 이후 에코백을 들고 다니는 것이 모두에게 자연스러운 일상 습관이 되었습니다."}, {"step": "6. 결론 마무리", "en": "For these reasons, government restrictions are essential to protect our planet for future generations.", "ko": "이러한 이유로 미래 세대를 위해 지구를 보호하려면 정부의 규제가 필수적입니다."}], "magicSentences": [{"en": "It reduces plastic waste and protects the environment.", "ko": "플라스틱 쓰레기를 줄이고 환경을 보호합니다.", "tip": "시계토끼 만능 #175 (환경 정책 찬성 1순위 문장)"}, {"en": "It encourages citizens to use reusable tumblers and eco-bags.", "ko": "시민들이 다회용 텀블러와 에코백을 사용하도록 장려합니다.", "tip": "일회용품 규제 구체적 효과"}], "vocabulary": [{"word": "restrict", "ipa": "[rɪˈstrɪkt]", "pos": "동사", "meaning": "제한하다, 규제하다"}, {"word": "disposable", "ipa": "[dɪˈspoʊzəbl]", "pos": "형용사", "meaning": "일회용의"}, {"word": "reusable", "ipa": "[ˌriːˈjuːzəbl]", "pos": "형용사", "meaning": "재사용 가능한, 다회용의"}, {"word": "regulation", "ipa": "[ˌreɡjuˈleɪʃn]", "pos": "명사", "meaning": "규제, 법규"}], "explanation": "환경 보호 및 정부 규제(Government regulation) 관련 파트 5 문제는 찬성(Agree) 입장을 취하고 '환경 오염 감소(reduce pollution)'와 '텀블러/에코백 사용 습관화(reusable tumblers and eco-bags)' 예시를 들면 만점 답변이 완성됩니다."}, {"id": "p5-10", "part": 5, "qNum": "#10", "category": "채용·인사관리", "topic": "신입 대졸자(New Graduates) 채용 vs 경력직(Experienced Workers) 채용", "prepTime": 45, "responseTime": 60, "question": "When hiring new employees, do you think companies should prefer experienced workers or recent university graduates? Give specific reasons and examples.", "questionKo": "신규 직원을 채용할 때 기업이 경력직 근로자와 최근 대학 졸업자(신입) 중 어느 쪽을 더 선호해야 한다고 생각합니까?", "sentences": [{"step": "1. 서론 (경력직 선택)", "en": "When hiring new employees, I definitely think companies should prefer experienced workers over recent university graduates.", "ko": "신규 직원을 채용할 때 저는 기업이 최근 대학 졸업자보다 경력직 근로자를 확실히 더 선호해야 한다고 생각합니다."}, {"step": "2. 본론 1 (교육 시간·비용 절감)", "en": "First of all, experienced workers already have practical skills and industry knowledge, so the company can save time and money on training.", "ko": "무엇보다도 경력직 근로자들은 이미 실무 기술과 업계 지식을 갖추고 있어서 회사가 교육에 드는 시간과 비용을 절약할 수 있습니다."}, {"step": "3. 본론 1 부연", "en": "They can adapt to the new workplace immediately and start contributing to projects right away.", "ko": "그들은 새로운 직장에 즉시 적응할 수 있고 프로젝트에 바로 기여하기 시작할 수 있습니다."}, {"step": "4. 본론 2 (위기 대처 능력)", "en": "Second, based on their past experience, they can handle unexpected problems professionally without panicking.", "ko": "둘째, 과거 경험을 바탕으로 예상치 못한 문제들도 당황하지 않고 전문적으로 처리할 수 있습니다."}, {"step": "5. 구체적 예시", "en": "For example, when our team hired an experienced marketer last year, she immediately solved a client issue and boosted our team's performance.", "ko": "예를 들어 작년에 저희 팀이 경력직 마케터를 채용했을 때 그녀는 즉시 고객사 문제를 해결하고 팀 성과를 끌어올렸습니다."}, {"step": "6. 결론 마무리", "en": "Therefore, hiring experienced workers is much more advantageous for a company's growth.", "ko": "따라서 경력직 근로자를 채용하는 것이 기업의 성장에 훨씬 더 유리합니다."}], "magicSentences": [{"en": "The company can save a lot of time and money on training.", "ko": "회사가 교육에 드는 많은 시간과 비용을 아낄 수 있습니다.", "tip": "시계토끼 만능 #153 (경력직 채용 찬성 핵심 문장)"}, {"en": "They can adapt to the workplace immediately and handle problems professionally.", "ko": "직장에 즉시 적응하고 문제를 전문적으로 처리할 수 있습니다.", "tip": "시계토끼 만능 #154 (실무 적응력 강조)"}], "vocabulary": [{"word": "experienced workers", "ipa": "[ɪkˈspɪriənst ˈwɜːrkərz]", "pos": "명사구", "meaning": "경력직 근로자들"}, {"word": "practical skills", "ipa": "[ˈpræktɪkl skɪlz]", "pos": "명사구", "meaning": "실무 기술"}, {"word": "adapt to", "ipa": "[əˈdæpt tuː]", "pos": "숙어", "meaning": "~에 적응하다"}, {"word": "advantageous", "ipa": "[ˌædvənˈteɪdʒəs]", "pos": "형용사", "meaning": "유리한, 이로운"}], "explanation": "경력직(Experienced workers) vs 신입(New graduates) 비교 문제는 경력직을 선택하면 1) 교육 시간·비용  "keywords": "stay at [steɪ æt] ~에 머무르다"}, {"id": "#109", "part": 4, "category": "식사 일정", "en": "You will have lunch.", "ko": "당신은 점심 식사를 할 거예요.", "tip": "일정표에 Lunch with [이름]이 있으면 You will have lunch with [이름].", "keywords": "have lunch [hæv lʌntʃ] 점심을 먹다"}, {"id": "#110", "part": 4, "category": "식사 일정", "en": "You will have dinner.", "ko": "당신은 저녁 식사를 할 거예요.", "tip": "저녁 만찬 일정 안내에 사용합니다.", "keywords": "have dinner [hæv ˈdɪnər] 저녁을 먹다"}, {"id": "#111", "part": 4, "category": "업무 일정", "en": "You will have a meeting.", "ko": "당신은 회의를 할 거예요.", "tip": "명사 Meeting만 적힌 표를 완전한 문장으로 바꿀 때 씁니다.", "keywords": "have a meeting [hæv ə ˈmiːtɪŋ] 회의를 하다"}, {"id": "#112", "part": 4, "category": "발표/연설 일정", "en": "You will give a speech.", "ko": "당신은 연설을 할 거예요.", "tip": "speech, presentation, lecture 앞에는 동사 give를 붙이세요.", "keywords": "give a speech [ɡɪv ə spiːtʃ] 연설하다"}, {"id": "#113", "part": 4, "category": "발표/연설 일정", "en": "You will give a presentation.", "ko": "당신은 프레젠테이션(발표)을 할 거예요.", "tip": "발표 일정 안내 시 give a presentation on [주제].", "keywords": "give a presentation [ɡɪv ə ˌpriːznˈteɪʃn] 발표하다"}, {"id": "#114", "part": 4, "category": "발표/연설 일정", "en": "You will give a lecture.", "ko": "당신은 강의를 할 거예요.", "tip": "대학이나 세미나 강연 일정 안내에 사용합니다.", "keywords": "give a lecture [ɡɪv ə ˈlektʃər] 강의하다"}, {"id": "#115", "part": 4, "category": "일정 취소 (Q9)", "en": "There was supposed to be an interview, but it has been canceled.", "ko": "인터뷰가 예정되어 있었으나 취소되었어요.", "tip": "표에 취소선(취소)이 그어진 항목을 정정할 때 쓰는 1등급 구문!", "keywords": "be supposed to [biː səˈpoʊzd tuː] ~하기로 되어 있다 / canceled [ˈkænsld] 취소된"}, {"id": "#116", "part": 4, "category": "일정 연기 (Q9)", "en": "There was supposed to be a meeting, but it has been postponed.", "ko": "미팅이 예정되어 있었으나 연기되었어요.", "tip": "일정이 미뤄진(postponed/delayed) 경우 그대로 대입하세요.", "keywords": "postponed [poʊstˈpoʊnd] 연기된"}, {"id": "#117", "part": 4, "category": "일정 변경 (Q9)", "en": "There was supposed to be a meeting with Jane White at 2:00 p.m. on Tuesday, but it has been rescheduled to Friday.", "ko": "화요일 오후 2시에 제인 화이트 씨와의 미팅이 예정되어 있었으나 금요일로 조정되었어요.", "tip": "요일이나 시간이 변경된 경우 has been rescheduled to [새 일정]으로 답합니다.", "keywords": "rescheduled to [ˌriːˈskedʒuːld tuː] ~로 일정이 변경된"}, {"id": "#118", "part": 4, "category": "이력서 학력 안내", "en": "She got a master's degree in design from Vancouver Art University in 2010.", "ko": "그녀는 2010년에 밴쿠버 예술대학교에서 디자인 전공으로 석사학위를 취득했어요.", "tip": "이력서(Resume) 표 문제에서 학력(Education)을 문장으로 읽는 공식!", "keywords": "master's degree in [ˈmæstərz dɪˈɡriː ɪn] ~ 전공 석사학위"}, {"id": "#119", "part": 4, "category": "이력서 과거 경력", "en": "From 2015 to 2017, she worked at Jasper Fashion Magazine as a director.", "ko": "2015년부터 2017년까지 그녀는 재스퍼 패션 잡지사에서 이사로 일했어요.", "tip": "과거 경력은 From [연도] to [연도], worked at [회사] as a [직책]!", "keywords": "work as [wɜːrk æz] ~(직책)으로 일하다"}, {"id": "#120", "part": 4, "category": "이력서 현재 경력", "en": "From 2017 up to now, she has worked at Toronto Fashion Magazine as a chief editor.", "ko": "2017년부터 지금까지 그녀는 토론토 패션 잡지사에서 편집장으로 일해오고 있어요.", "tip": "2017 ~ Present(현재)로 적힌 경력은 현재완료(has worked)로 읽으면 만점!", "keywords": "up to now [ʌp tuː naʊ] 지금까지 / chief editor [tʃiːf ˈedɪtər] 편집장"}, {"id": "#121", "part": 4, "category": "이력서 자격/추천", "en": "I think she is qualified because she has a lot of experience.", "ko": "저는 그녀가 자격을 갖췄다고 생각해요, 왜냐하면 경험이 많기 때문이에요.", "tip": "지원자가 왜 적합한지 묻는 질문의 오프닝 공식입니다.", "keywords": "qualified [ˈkwɑːlɪfaɪd] 자격을 갖춘"}, {"id": "#122", "part": 4, "category": "이력서 어학 능력", "en": "He is fluent in Spanish.", "ko": "그는 스페인어를 유창하게 구사해요.", "tip": "이력서 Skills 칸에 언어가 적혀 있을 때 is fluent in [언어]!", "keywords": "fluent in [ˈfluːənt ɪn] ~에 유창한"}, {"id": "#123", "part": 4, "category": "이력서 자격증", "en": "She is certified in Pilates.", "ko": "그녀는 필라테스 자격증이 있어요.", "tip": "자격증(Certification) 보유 여부를 말할 때 쓰는 핵심 표현.", "keywords": "certified in [ˈsɜːrtɪfaɪd ɪn] ~ 자격증을 보유한"}, {"id": "#124", "part": 4, "category": "이력서 분야 경험", "en": "He has experience in education.", "ko": "그는 교육 분야의 경험이 있어요.", "tip": "특정 분야 경력은 has experience in [분야]로 표현합니다.", "keywords": "experience in [ɪkˈspɪriəns ɪn] ~ 분야의 경험"}, {"id": "#125", "part": 4, "category": "면접 일정 안내", "en": "You will interview Jessica Anderson at 9:00 a.m.", "ko": "당신은 제시카 앤더슨과 오전 9시에 면접을 볼 거예요.", "tip": "면접관 입장의 면접 시간표(Interview Schedule) 안내 공식.", "keywords": "interview [ˈɪntərvjuː] 면접을 보다"}, {"id": "#126", "part": 4, "category": "면접 지원자 상세", "en": "You have an interview with John White from Echo Electronics, who is applying for the Marketing Manager position.", "ko": "마케팅 부장직에 지원하는 에코전자의 존 화이트 씨와 면접이 있어요.", "tip": "이름 + 소속 회사 + 지원 직책을 관계대명사 who로 한 문장에 묶는 고득점 공식!", "keywords": "apply for [əˈplaɪ fɔːr] ~에 지원하다"}, {"id": "#127", "part": 4, "category": "경력 연수 안내", "en": "She has five years of experience.", "ko": "그녀는 5년의 경력이 있어요.", "tip": "표에 '5 yrs exp.'라고 적힌 약어를 풀어서 읽는 문장입니다.", "keywords": "years of experience [jɪrz əv ɪkˈspɪriəns] ~년의 경력"}, {"id": "#128", "part": 4, "category": "지원 직책 안내", "en": "He is applying for the editor position.", "ko": "그는 편집자 직책에 지원하고 있어요.", "tip": "지원 분야(Position Applied)를 설명할 때 씁니다.", "keywords": "position [pəˈzɪʃn] 직책, 포지션"}, {"id": "#129", "part": 4, "category": "수강료/비용 안내", "en": "You have to pay 20 dollars for the oil painting class.", "ko": "유화 수업을 들으려면 20달러를 지불하셔야 해요.", "tip": "강좌/등록비 안내 표에서 금액을 전달하는 문장입니다.", "keywords": "pay A for B [peɪ fɔːr] B의 비용으로 A를 지불하다"}, {"id": "#130", "part": 4, "category": "등록 마감일 안내", "en": "You should register by January 3rd.", "ko": "1월 3일까지 등록하셔야 해요.", "tip": "마감 기한(Deadline) 앞에는 전치사 by(~까지)를 씁니다.", "keywords": "register by [ˈredʒɪstər baɪ] ~까지 등록하다"}, {"id": "#131", "part": 4, "category": "회원 할인/무료 조건", "en": "If you are a member, it's 20 dollars. It's free for members.", "ko": "당신이 회원이라면 20달러예요. 회원들에게는 무료예요.", "tip": "회원/비회원 요금 차이를 설명할 때 쓰는 필수 조건문!", "keywords": "for members [fɔːr ˈmembərz] 회원을 위한"}, {"id": "#132", "part": 4, "category": "강좌 개설 안내", "en": "There is a cooking for beginners class.", "ko": "초보자를 위한 요리 수업이 있어요.", "tip": "강좌 시간표에서 개설 과목을 소개할 때 사용합니다.", "keywords": "for beginners [fɔːr bɪˈɡɪnərz] 초보자를 위한"}, {"id": "#133", "part": 4, "category": "강사 안내", "en": "Sean Ken will teach the painting class. There is a class on French art history.", "ko": "션 켄 강사가 회화 수업을 지도할 거예요. 프랑스 예술사에 관한 수업이 있어요.", "tip": "강사 이름이 주어로 오면 will teach [수업명]으로 말하세요.", "keywords": "teach a class [tiːtʃ ə klæs] 수업을 가르치다"}, {"id": "#134", "part": 4, "category": "강사 및 과목 안내", "en": "Jennifer Houston will teach a class on computer skills.", "ko": "제니퍼 휴스턴 강사가 컴퓨터 기술에 관한 수업을 지도할 예정이에요.", "tip": "[강사명] will teach a class on [주제] 공식으로 깔끔하게 마무리!", "keywords": "computer skills [kəmˈpjuːtər skɪlz] 컴퓨터 기술"}, {"id": "#135", "part": 5, "category": "학습/자기계발", "en": "They can learn new things.", "ko": "그들은 새로운 것들을 배울 수 있어요.", "tip": "교육, 여행, 새로운 도전, 인턴십, 독서 찬성 논거 1순위!", "keywords": "learn new things [lɜːrn nuː θɪŋz] 새로운 것을 배우다"}, {"id": "#136", "part": 5, "category": "인맥/네트워킹", "en": "They can meet new people and expand their network.", "ko": "그들은 새로운 사람들을 만나고 인맥을 넓힐 수 있어요.", "tip": "오프라인 모임, 사교 활동, 대학 생활, 대면 근무의 장점.", "keywords": "expand one's network [ɪkˈspænd ˈnetwɜːrk] 인맥을 넓히다"}, {"id": "#137", "part": 5, "category": "경험/식견 확장", "en": "They can experience many things and broaden their horizons.", "ko": "그들은 많은 것을 경험하고 그들의 견문을 넓힐 수 있어요.", "tip": "해외여행, 현장 학습, 다양한 활동 찬성 시 AL급 고급 표현!", "keywords": "broaden one's horizons [ˈbrɔːdn həˈraɪznz] 견문/시야를 넓히다"}, {"id": "#138", "part": 5, "category": "미성숙/의사결정 한계", "en": "They can't make good decisions because they are not mature enough.", "ko": "그들은 아직 충분히 성숙하지 않기 때문에 올바른 결정을 하지 못해요.", "tip": "어린이/학생에게 과도한 자율권이나 스마트폰을 주는 것에 반대할 때 사용.", "keywords": "mature enough [məˈtʃʊr ɪˈnʌf] 충분히 성숙한"}, {"id": "#139", "part": 5, "category": "집중력 저하", "en": "They will be distracted.", "ko": "그들은 집중력이 분산될 거예요.", "tip": "스마트폰, 소음, 게임, 멀티태스킹의 단점을 지적할 때 필수.", "keywords": "be distracted [biː dɪˈstræktɪd] 주의가 산만해지다"}, {"id": "#140", "part": 5, "category": "학업/업무 지장", "en": "They cannot concentrate on their studies, and they can't focus on their work.", "ko": "그들은 공부에 집중할 수가 없고, 일에 집중할 수가 없어요.", "tip": "#139 뒤에 바로 붙여 학생이나 직장인의 부작용을 설명하세요.", "keywords": "concentrate on [ˈkɑːnsntreɪt ɑːn] ~에 집중하다"}, {"id": "#141", "part": 5, "category": "성적 저하", "en": "They can't get good grades at school.", "ko": "그들은 학교에서 좋은 성적을 받을 수 없어요.", "tip": "학생 관련 주제(벼락치기, 스마트폰, 아르바이트)의 단점 논거.", "keywords": "get good grades [ɡet ɡʊd ɡreɪdz] 좋은 성적을 받다"}, {"id": "#142", "part": 5, "category": "학업 뒤처짐", "en": "They will fall behind in class.", "ko": "그들은 학급(수업)에서 뒤처질 거예요.", "tip": "#141과 세트로 쓰면 설득력이 2배가 됩니다.", "keywords": "fall behind [fɔːl bɪˈhaɪnd] 뒤처지다"}, {"id": "#143", "part": 5, "category": "업무 효율 저하", "en": "They can't work efficiently.", "ko": "그들은 효율적으로 일할 수 없어요.", "tip": "직장 관련 부정적 상황을 설명할 때 만능입니다.", "keywords": "work efficiently [wɜːrk ɪˈfɪʃntli] 효율적으로 일하다"}, {"id": "#144", "part": 5, "category": "경제적 이점", "en": "They can save money.", "ko": "그들은 돈을 절약할 수 있어요.", "tip": "재택근무, 온라인 강의, 대중교통, 기숙사 생활의 장점.", "keywords": "save money [seɪv ˈmʌni] 돈을 아끼다"}, {"id": "#145", "part": 5, "category": "물가/생활비 부담", "en": "The cost of living is too high.", "ko": "생활비가 너무 비싸요.", "tip": "경제/급여/주거 관련 주제에서 현실적 배경을 설명할 때 씁니다.", "keywords": "cost of living [kɔːst əv ˈlɪvɪŋ] 생활비, 물가"}, {"id": "#146", "part": 5, "category": "생계 유지", "en": "They can't make a living.", "ko": "그들은 생계를 유지할 수 없어요.", "tip": "낮은 급여나 불안정한 직업의 단점을 지적할 때 사용.", "keywords": "make a living [meɪk ə ˈlɪvɪŋ] 생계를 꾸리다"}, {"id": "#147", "part": 5, "category": "높은 연봉/보상", "en": "I can get a high salary, and I can get a higher salary.", "ko": "저는 높은 급여를 받을 수 있고, 더 높은 급여를 받을 수 있어요.", "tip": "대기업 취업이나 전문 자격증 취득을 선호하는 이유.", "keywords": "high salary [haɪ ˈsæləri] 높은 급여/연봉"}, {"id": "#148", "part": 5, "category": "가치 있는 투자", "en": "That's a good investment because it makes lives better.", "ko": "그것은 삶을 더 나아지게 만들어 주기 때문에 좋은 투자예요.", "tip": "교육비, 건강 관리, 정부 예산 투입 찬성 시 강력한 결론 문장!", "keywords": "good investment [ɡʊd ɪnˈvestmənt] 좋은 투자"}, {"id": "#149", "part": 5, "category": "집중력 향상", "en": "They can fo : "not good for health [nɑːt ɡʊd fɔːr helθ] 건강에 좋지 않은"}, {"id": "#183", "part": 5, "category": "생활 습관 형성", "en": "It can develop healthy habits, or it can develop unhealthy habits.", "ko": "그것은 건강한 습관을 기를 수 있어요 / 건강하지 않은 습관을 기를 수 있어요.", "tip": "어린이 교육이나 일상 루틴 주제의 찬반 양쪽에 모두 활용 가능!", "keywords": "develop habits [dɪˈveləp ˈhæbɪts] 습관을 기르다"}, {"id": "#184", "part": 5, "category": "환경 보호/오염", "en": "Pollution is a serious issue these days, and it can make a cleaner environment so we will be able to protect the environment.", "ko": "환경오염은 요즘 심각한 문제예요. 그것은 더 깨끗한 환경을 만들 수 있고 우리는 환경을 보호할 수 있을 거예요.", "tip": "환경·재활용·대중교통·친환경 정책 주제를 한 방에 끝내는 콤보!", "keywords": "protect the environment [prəˈtekt ðə ɪnˈvaɪrənmənt] 환경을 보호하다"}, {"id": "#185", "part": 5, "category": "과거 vs 현재 에피소드 (정보 검색)", "en": "Most of all, people can find answers very quickly on the internet, so they can save time. However, in the past, people had to go to the library and look through books.", "ko": "무엇보다도 사람들은 인터넷에서 아주 빠르게 답을 찾을 수 있어서 시간을 절약할 수 있어요. 하지만 예전에는 도서관에 가서 책을 뒤져야 했어요.", "tip": "60초 답변에서 마지막 20초를 채워주는 과거 vs 현재 비교 만능 스토리!", "keywords": "look through books [lʊk θruː bʊks] 책을 뒤지다/찾아보다"}, {"id": "#186", "part": 5, "category": "과거 vs 현재 에피소드 (온라인 교육)", "en": "Previously, students had to go to a classroom to study. But these days, they can study online without going anywhere.", "ko": "예전에는 학생들이 공부를 하기 위해 교실에 가야만 했어요. 하지만 요즘은 어디 가지 않아도 온라인으로 공부할 수 있어요.", "tip": "온라인 교육, 기술 발전, 인터넷의 장점을 뒷받침하는 만능 예시!", "keywords": "without going anywhere [wɪˈðaʊt ˈɡoʊɪŋ ˈeniwer] 어디 가지 않고도"}, {"id": "#187", "part": 5, "category": "과거 vs 현재 에피소드 (모바일 앱 & 재택근무)", "en": "People used to wait for a taxi, but now they use mobile apps to call a taxi. Thanks to technology, many workers can work from home and save time.", "ko": "사람들이 예전에는 택시를 기다리곤 했지만 지금은 앱을 사용해요. 기술 덕분에 많은 직장인들이 재택근무를 하고 시간을 절약할 수 있어요.", "tip": "스마트폰, 기술 혁신, 재택근무 주제에서 시간 채우기용 1등급 에피소드!", "keywords": "thanks to technology [θæŋks tuː tekˈnɑːlədʒi] 기술 덕분에"}]}; // Part 2~5 순수 187개

    // 앱 상태
    const state = {
      activePart: 'part1',
      selectedIndex: 0,
      part3TypeFilter: 'ALL',
      part4TableTypeFilter: 'ALL',
      isAnswerOpen: false,
      p4AnswerOpenMap: {},
      p4QTextOpenMap: {}, // 파트 4 질문 지문 숨김/열림 맵
      isVocabModalOpen: false,
      modalPartFilter: 'ALL',
      modalSearchQuery: '',
      memorizedIds: JSON.parse(localStorage.getItem('toeic_memorized_187') || '{}'),
      playingKey: null,
      // 2. 발음 선택 상태
      selectedItemId: null,
      selectedSpeechText: '',
      isDarkMode: localStorage.getItem('toeic_dark_mode') === 'true',
      // CBT 타이머 상태
      timerInterval: null,
      timerStage: 'standby', // 'standby' | 'prep' | 'response' | 'ended'
      timerTotalSeconds: 45,
      timerRemainingSeconds: 45,
      timerPrepLimit: 45,
      timerResponseLimit: 45
    };

    // 3. 다크모드 iOS 스위치 토글 함수
    function toggleDarkMode() {
      state.isDarkMode = !state.isDarkMode;
      document.body.classList.toggle('dark', state.isDarkMode);
      const thumb = document.getElementById('themeThumb');
      if (thumb) thumb.textContent = state.isDarkMode ? '🌙' : '☀️';
      localStorage.setItem('toeic_dark_mode', state.isDarkMode ? 'true' : 'false');
    }

    function initTheme() {
      if (state.isDarkMode) {
        document.body.classList.add('dark');
        const thumb = document.getElementById('themeThumb');
        if (thumb) thumb.textContent = '🌙';
      }
    }

    // =========================================================================
    // 1. Daniel 음성 고정 (다른 음성 제거)
    // =========================================================================
    function getDanielVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      if (!voices || voices.length === 0) return null;

      const daniel = voices.find(v => (v.name || '').toLowerCase().includes('daniel'));
      if (daniel) return daniel;

      const enMale = voices.find(v => {
        const n = (v.name || '').toLowerCase();
        const l = (v.lang || '').toLowerCase();
        return l.startsWith('en') && (n.includes('guy') || n.includes('andrew') || n.includes('tom') || n.includes('alex') || n.includes('evan'));
      });
      if (enMale) return enMale;

      return voices.find(v => (v.lang || '').toLowerCase().startsWith('en')) || voices[0] || null;
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => { getDanielVoice(); };
    }

    // 2. 발음 선택형 칸 클릭 시 호출 함수
    function selectSpeechItem(id, text) {
      state.selectedItemId = id;
      state.selectedSpeechText = text;
      document.querySelectorAll('.speech-selectable').forEach(el => {
        if (el.getAttribute('data-speech-id') === id) {
          el.classList.add('selected');
        } else {
          el.classList.remove('selected');
        }
      });
    }

    // 1. 하단 플로팅 바에서 1.0x 또는 0.75x 클릭 시 실행
    function playSelectedRate(rate) {
      if (!state.selectedSpeechText) {
        const firstEl = document.querySelector('.speech-selectable');
        if (firstEl) {
          const id = firstEl.getAttribute('data-speech-id');
          const txt = firstEl.getAttribute('data-speech-text');
          if (id && txt) {
            selectSpeechItem(id, txt);
          }
        }
      }
      if (state.selectedSpeechText) {
        speakText(state.selectedSpeechText, rate, `selected-${rate}`);
        updateRateButtonsUI(rate);
      }
    }

    function updateRateButtonsUI(activeRate) {
      const b10 = document.getElementById('btnFloatingRate10');
      const b075 = document.getElementById('btnFloatingRate075');
      if (b10) b10.classList.toggle('active-playing', activeRate === 1.0 && !!state.playingKey);
      if (b075) b075.classList.toggle('active-playing', activeRate === 0.75 && !!state.playingKey);
    }

    // 독립 정지 함수
    function stopSpeech() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      state.playingKey = null;
      updateRateButtonsUI(null);
    }

    function speakText(text, rate = 1.0, key = '') {
      if (!('speechSynthesis' in window)) return;

      if (state.playingKey === key) {
        stopSpeech();
        return;
      }

      window.speechSynthesis.cancel();
      state.playingKey = key;
      updateRateButtonsUI(rate);

      const cleaned = text.replace(/[↗↘↑↓/]/g, ' ').replace(/\s+/g, ' ').trim();
      const utter = new SpeechSynthesisUtterance(cleaned);
      const voice = getDanielVoice();
      if (voice) {
        utter.voice = voice;
        utter.lang = voice.lang || 'en-US';
      } else {
        utter.lang = 'en-US';
      }
      utter.rate = rate;
      utter.pitch = 0.98;

      utter.onend = () => {
        if (state.playingKey === key) {
          state.playingKey = null;
          updateRateButtonsUI(null);
        }
      };
      utter.onerror = () => {
        if (state.playingKey === key) {
          state.playingKey = null;
          updateRateButtonsUI(null);
        }
      };

      window.speechSynthesis.speak(utter);
    }

    function updateCapsuleButtons() {
      document.querySelectorAll('[data-rate-key]').forEach(btn => {
        const k = btn.getAttribute('data-rate-key');
        if (state.playingKey && k === state.playingKey) {
          btn.classList.add('active-playing');
        } else {
          btn.classList.remove('active-playing');
        }
      });
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // 5 & 6. 배속 캡슐 + 정지 버튼 렌더러
    function renderRateCapsules(text, baseKey) {
      const safe = escapeHtml(text);
      const k1 = `${baseKey}-1.0`;
      const k2 = `${baseKey}-0.75`;
      return `
        <div class="rate-capsule-group">
          <button type="button" class="btn-rate-capsule ${state.playingKey === k1 ? 'active-playing' : ''}"
            data-rate-key="${k1}" data-rate-text="${safe}" data-rate-val="1.0"
            onclick="handleRateClick(this)">
            1.0x
          </button>
          <button type="button" class="btn-rate-capsule ${state.playingKey === k2 ? 'active-playing' : ''}"
            data-rate-key="${k2}" data-rate-text="${safe}" data-rate-val="0.75"
            onclick="handleRateClick(this)">
            0.75x
          </button>
          <button type="button" class="btn-rate-capsule btn-rate-stop" onclick="stopSpeech()" title="음성 정지">
            정지
          </button>
        </div>
      `;
    }

    function handleRateClick(btn) {
      const text = btn.getAttribute('data-rate-text') || '';
      const rate = parseFloat(btn.getAttribute('data-rate-val') || '1.0');
      const key = btn.getAttribute('data-rate-key') || '';
      speakText(text, rate, key);
    }

    // =========================================================================
    // 5. CBT 실시간 카운트다운 타이머 & Beep 사운드
    // =========================================================================
    function playBeepSound(freq = 880, duration = 0.25) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {
        console.warn('AudioContext not allowed without user interaction', e);
      }
    }

    function resetTimer(prepSec = null, respSec = null) {
      if (state.timerInterval) {
        clearInterval(state.timerInterval);
        state.timerInterval = null;
      }
      if (prepSec !== null) state.timerPrepLimit = prepSec;
      if (respSec !== null) state.timerResponseLimit = respSec;

      state.timerStage = 'standby';
      state.timerTotalSeconds = state.timerPrepLimit;
      state.timerRemainingSeconds = state.timerPrepLimit;
      updateTimerUI();
    }

    function toggleTimer() {
      if (state.timerInterval) {
        // 일시정지
        clearInterval(state.timerInterval);
        state.timerInterval = null;
        updateTimerUI();
        return;
      }

      if (state.timerStage === 'standby' || state.timerStage === 'ended') {
        state.timerStage = 'prep';
        state.timerTotalSeconds = state.timerPrepLimit;
        state.timerRemainingSeconds = state.timerPrepLimit;
      }

      state.timerInterval = setInterval(() => {
        if (state.timerRemainingSeconds > 0) {
          state.timerRemainingSeconds--;
          updateTimerUI();
        } else {
          // 스테이지 전환
          if (state.timerStage === 'prep') {
            playBeepSound(1000, 0.4); // 삐- 신호음
            state.timerStage = 'response';
            state.timerTotalSeconds = state.timerResponseLimit;
            state.timerRemainingSeconds = state.timerResponseLimit;
            updateTimerUI();
          } else if (state.timerStage === 'response') {
            playBeepSound(587, 0.6); // 종료음
            state.timerStage = 'ended';
            clearInterval(state.timerInterval);
            state.timerInterval = null;
            updateTimerUI();
          }
        }
      }, 1000);

      updateTimerUI();
    }

    function updateTimerUI() {
      const badge = document.getElementById('timerStageBadge');
      const clock = document.getElementById('timerDigitalClock');
      const progress = document.getElementById('timerProgressFill');
      const btn = document.getElementById('btnTimerStart');
      const info = document.getElementById('timerInfoCaption');
      if (!badge || !clock || !progress || !btn || !info) return;

      const m = Math.floor(state.timerRemainingSeconds / 60);
      const s = state.timerRemainingSeconds % 60;
      clock.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

      const pct = state.timerTotalSeconds > 0
        ? Math.max(0, Math.min(100, (state.timerRemainingSeconds / state.timerTotalSeconds) * 100))
        : 0;
      progress.style.width = `${pct}%`;

      if (state.timerStage === 'prep') {
        badge.className = 'timer-stage-badge prep';
        badge.innerHTML = '<span class="voice-dot" style="background:#0071E3;"></span> 준비 시간';
        progress.style.backgroundColor = 'var(--apple-blue)';
        btn.textContent = state.timerInterval ? '⏸ 일시정지' : '▶ 계속';
        info.innerHTML = `준비 시간 ${state.timerRemainingSeconds}초 남음 ➔ 종료 시 비프음 후 답변 시간(${state.timerResponseLimit}초) 자동 전환`;
      } else if (state.timerStage === 'response') {
        badge.className = 'timer-stage-badge response';
        badge.innerHTML = '<span class="voice-dot" style="background:#FF3B30;"></span> 답변 시간 (Speak Now)';
        progress.style.backgroundColor = 'var(--apple-red)';
        btn.textContent = state.timerInterval ? '⏸ 일시정지' : '▶ 계속';
        info.innerHTML = `🎙️ 답변 시간 진행 중! (${state.timerRemainingSeconds}초 남음)`;
      } else if (state.timerStage === 'ended') {
        badge.className = 'timer-stage-badge standby';
        badge.textContent = '답변 종료 (Time Over)';
        progress.style.backgroundColor = 'var(--apple-text-muted)';
        btn.textContent = '↺ 다시 시작';
        info.innerHTML = '시험 시간이 종료되었습니다. 초기화 후 다시 연습해 보세요.';
      } else {
        badge.className = 'timer-stage-badge standby';
        badge.textContent = '타이머 대기 중';
        progress.style.backgroundColor = 'var(--apple-blue)';
        btn.textContent = '▶ 시작';
        info.innerHTML = `준비 ${state.timerPrepLimit}초 ➔ 삐(Beep) ➔ 답변 ${state.timerResponseLimit}초`;
      }
    }

    function renderCbtTimerCard(prepSec, respSec) {
      return `
        <div class="cbt-timer-card">
          <div class="timer-top-line">
            <div class="timer-stage-badge standby" id="timerStageBadge">타이머 대기 중</div>
            <div class="timer-digital-display" id="timerDigitalClock">00:${String(prepSec).padStart(2, '0')}</div>
            <div class="timer-btn-actions">
              <button type="button" class="btn-timer-ctrl" id="btnTimerStart" onclick="toggleTimer()">▶ 시작</button>
              <button type="button" class="btn-timer-ctrl" onclick="resetTimer(${prepSec}, ${respSec})">↺ 초기화</button>
            </div>
          </div>
          <div class="timer-progress-track">
            <div class="timer-progress-fill" id="timerProgressFill" style="width: 100%;"></div>
          </div>

      `;

    function renderSegmentedTabs() {

      stopSpeech();
      state.activePart = partId;
      state.selectedIndex = 0;
      state.isAnswerOpen = false;
      state.p4AnswerOpenMap = {};
      state.p4QTextOpenMap = {};
      renderSegmentedTabs();
      renderMainViewport();
      updateDrawerContent();

    function getActiveItems() {
      if (state.activePart === 'part1') return MASTER_DATA.part1;
      if (state.activePart === 'part2') return MASTER_DATA.part2;
      if (state.activePart === 'part3') {
        if (state.part3TypeFilter === 'ALL') return MASTER_DATA.part3;
        return MASTER_DATA.part3.filter(q => q.typeId === state.part3TypeFilter);
      }
      if (state.activePart === 'part4') {
        if (state.part4TableTypeFilter === 'ALL') return MASTER_DATA.part4;
        return MASTER_DATA.part4.filter(s => s.tableTypeId === state.part4TableTypeFilter);
      }
      if (state.activePart === 'part5') return MASTER_DATA.part5;
      return [];
    }

    function updateFloatingNav() {
      const items = getActiveItems();
      const text = document.getElementById('floatingNavText');
      const btnPrev = document.getElementById('btnFloatingPrev');
      const btnNext = document.getElementById('btnFloatingNext');
      if (!text || !btnPrev || !btnNext) return;

      const cur = state.selectedIndex + 1;
      const total = items.length;
      text.textContent = `${cur} / ${total}`;
      btnPrev.disabled = state.selectedIndex === 0;
      btnNext.disabled = state.selectedIndex >= total - 1;
    }

    function navPrev() {
      if (state.selectedIndex > 0) {
        selectItem(state.selectedIndex - 1);
      }
    }

    function navNext() {
      const items = getActiveItems();
      if (state.selectedIndex < items.length - 1) {
        selectItem(state.selectedIndex + 1);
      }
    }

    function selectItem(idx) {
      stopSpeech();
      state.selectedIndex = idx;
      state.isAnswerOpen = false;
      state.p4AnswerOpenMap = {};
      state.p4QTextOpenMap = {};
      renderMainViewport();
