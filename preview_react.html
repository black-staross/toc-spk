ndant lamps and a disco ball)"]}, "photoDescriptionKr": "[카페 조명 간판과 메뉴판 사진] 아늑하고 빈티지한 카페 카운터 위쪽을 담은 사진입니다. 알전구로 화사하게 불을 밝힌 대형 'CAFE' 글자 조명 간판이 가장 먼저 눈에 띄며, 그 아래에는 분필로 정갈하게 커피와 차 종류 및 가격이 적힌 검은 칠판 메뉴판이 있습니다. 천장에는 녹색 펜던트 조명과 작은 미러볼이 매달려 있습니다.", "answer": "This is a picture taken at the counter area of a cozy cafe.\nIn the upper part of the picture, a large illuminated sign spelling 'CAFE' with glowing lightbulbs catches the eye.\nBelow the sign, black chalkboard menus display various drinks and prices written in white chalk.\nSeveral green pendant lamps and a small disco ball hang from the ceiling, creating a retro mood.\nOverall, the cafe has a warm, vintage, and inviting atmosphere.", "answerTranslation": "이 사진은 아늑한 카페의 카운터 구역에서 찍힌 사진입니다.\n사진 위쪽에는 빛나는 전구로 'CAFE'라고 쓰인 대형 조명 간판이 눈길을 끕니다.\n간판 아래에는 검은 칠판 메뉴판에 흰색 분필로 적힌 다양한 음료와 가격이 표시되어 있습니다.\n천장에는 몇 개의 녹색 펜던트 조명과 작은 미러볼이 매달려 있어 레트로한 분위기를 연출합니다.\n전반적으로 카페는 따뜻하고 빈티지하며 아늑한 분위기를 풍깁니다.", "magicSentences": ["This is a picture taken at the counter of a cafe.", "A large illuminated sign catches the eye.", "Black chalkboard menus display various drinks and prices.", "Overall, the cafe has a warm and inviting atmosphere."], "scoreTip": "사물 중심 사진일 때는 'catches the eye(눈길을 사로잡다)'와 'hang from the ceiling(천장에 매달려 있다)' 표현을 활용하세요.", "vocabulary": [{"word": "illuminated sign", "ipa": "[ɪˈluːmɪneɪtɪd saɪn]", "pos": "명사구", "meaning": "조명 간판, 불이 켜진 간판", "source": "사진 필수"}, {"word": "chalkboard", "ipa": "[ˈtʃɔːkbɔːd]", "pos": "명사", "meaning": "칠판, 흑판", "source": "사진 필수"}, {"word": "pendant lamp", "ipa": "[ˈpendənt læmp]", "pos": "명사구", "meaning": "펜던트 조명 (천장 매달림 조명)", "source": "답변 핵심"}, {"word": "inviting", "ipa": "[ɪnˈvaɪtɪŋ]", "pos": "형용사", "meaning": "매력적인, 아늑한", "source": "답변 핵심"}], "grammarPoints": [{"title": "사물 위치 묘사: Below the sign, S+V", "explanation": "장소 부사구(Below the sign, In the upper part)를 문두에 두어 시선의 흐름을 자연스럽게 유도하는 기술입니다."}]}, {"id": 104, "setId": 4, "setNumber": 4, "qNumber": "Question 4", "questionNumber": "Question 4", "se ous", "ipa": "[ˈspeɪʃəs]", "pos": "형용사", "meaning": "넓은, 널찍한", "source": "답변 핵심"}, {"word": "woven chair", "ipa": "[ˈwəʊvn tʃeə(r)]", "pos": "명사구", "meaning": "라탄/엮은 의자", "source": "사진 필수"}, {"word": "cushion", "ipa": "[ˈkʊʃn]", "pos": "명사", "meaning": "쿠션, 방석", "source": "사진 필수"}, {"word": "indoor tree", "ipa": "[ˌɪndɔː ˈtriː]", "pos": "명사구", "meaning": "실내 관엽수 나무", "source": "사진 필수"}], "grammarPoints": [{"title": "수동태 완료형 상태: is seated at a table", "explanation": "is seated는 '자리에 앉아 있는 정적 상태'를 나타내는 세련된 표현으로, is sitting보다 자연스럽게 들립니다."}]}, {"id": 105, "setId": 5, "setNumber": 5, "qNumber": "Question 3", "questionNumber": "Question 3", "setTitle": "Set 5: Supermarket Aisle (마트 식료품 진열 통로)", "prepTime": 45, "responseTime": 30, "question": "Describe the picture on your screen in as much detail as you can.", "questionTranslation": "화면에 보이는 사진을 가능한 한 자세하게 묘사하세요.", "imageUrl": "https://images.unsplash.com/photo-1578916171728-46686eac8d58?auto=format&fit=crop&w=1200&q=80", "photoScene": {"category": "a supermarket", "locationEn": "in a supermarket aisle", "tags": ["장소: 슈퍼마켓 통로 (in a supermarket aisle)", "왼쪽 선반: 시리얼 상자들이 층층이 진열됨 (cereal boxes neatly stacked)", "오른쪽 선반: 우유 및 음료 팩들이 정돈됨 (cartons of milk and juice)", "배경: 저 멀리 카트를 밀고 가는 쇼핑객 (a shopper with a cart in the distance)"]}, "photoDescriptionKr": "[마트 식료품 진열 통로 사진] 환하고 넓은 대형 슈퍼마켓의 식료품 통로 사진입니다. 왼쪽 진열대에는 형형색색의 시리얼 상자들이 층층이 빼곡하게 진열되어 있고, 오른쪽 진열대에는 우유와 주스 팩들이 줄지어 정돈되어 있습니다. 반짝이는 타일 바닥 위로 천장 형광등 조명이 비치고 있으며, 저 멀리 통로 끝에는 카트를 끌고 장을 보는 손님이 보입니다.", "answer": "This is a picture taken in a bright supermarket aisle.\nThe aisle is lined with tall grocery shelves stretching far into the distance.\nOn the left shelves, colorful cereal boxes are neatly stacked on multiple tiers.\nOn the right, cartons of milk and packaged drinks are orderly arranged.\nIn the distance, a customer with a shopping cart can be seen walking down the aisle.\nOverall, the supermarket appears clean, fully stocked, and well-organized.", "answerTranslation": "이 사진은 밝은 슈퍼마켓 통로에서 찍힌 사진입니다.\n통로 양쪽에는 저 멀리까지 길게 뻗은 높은 식료품 선반들이 늘어서 있습니다.\n왼쪽 선반에는 다채로운 시리얼 상자들이 여러 층에 깔끔하게 쌓여 있습니다.\n오른쪽에는 우유 팩과 포장 음료들이 질서정연하게 정돈되어 있습니다.\n저 멀리에는 쇼핑 카트를 든 손님이 통로를 걸어가는 모습이 보입니다.\n전반적으로 슈퍼마켓은 깨끗하고, 재고가 가득하며, 잘 정돈되어 보입니다.", "magicSentences": ["This is a picture taken in a supermarket aisle.", "The aisle is lined with tall grocery shelves.", "Items are neatly stacked on multiple tiers.", "Overall, the store appears clean and well-organized."], "scoreTip": "식료품 진열 통로 묘사 시 'neatly stacked on multiple tiers(여러 층에 깔끔하게 쌓인)'와 'fully stocked(물건이 가득 찬)'를 꼭 사용하세요.", "vocabulary": [{"word": "aisle", "ipa": "[aɪl]", "pos": "명사", "meaning": "(마트/비행기의) 통로", "source": "사진 필수"}, {"word": "stack", "ipa": "[stæk]", "pos": "동사", "meaning": "쌓다, 포개다", "source": "답변 핵심"}, {"word": "carton", "ipa": "[ˈkɑːtn]", "pos": "명사", "meaning": "(우유/음료 등의) 종이팩", "source": "사진 필수"}, {"word": "fully stocked", "ipa": "[ˈfʊli stɒkt]", "pos": "형용사구", "meaning": "재고가 꽉 찬, 물건이 풍부한", "source": "답변 핵심"}], "grammarPoints": [{"title": "수동 구문: is lined with ~", "explanation": "The aisle is lined with shelves는 '통로가 선반들로 둘러싸여 늘어서 있다'는 뜻으로 공간감 표현에 최고입니다."}]}, {"id": 106, "setId": 6, "setNumber": 6, "qNumber": "Question 4", "questionNumber": "Question 4", "setTitle": "Set 6: Store Checkout Counter (계산대 카드 결제)", "prepTime": 45, "responseTime": 30, "question": "Describe the picture on your screen in as much detail as you can.", "questionTranslation": "화면에 보이는 사진을 가능한 한 자세하게 묘사하세요.", "imageUrl": "https://images.unsplash.com/photo-1556740738-b6a63e27c4df?auto=format&fit=crop&w=1200&q=80", "photoScene": {"category": "a checkout counter", "locationEn": "at a store checkout counter", "tags": ["장소: 매장 계산대 (at a checkout counter)", "중심 인물: 주황색 터틀넥 입고 카드 단말기에 카드 꽂는 미소 띤 여성 (smiling woman inserting a credit card)", "상대방: 왼쪽에서 POS 화면 보며 결제 돕는 점원의 손 (cashier assisting at the POS register)", "배경: 밝은 조명과 거울이 있는 세련된 매장 실내 (bright store interior with mirrors)"]}, "photoDescriptionKr": "[매장 계산대 카드 결제 사진] 매장 계산대 카운터에서 긴 갈색 머리의 미소 짓는 여성이 주황색 터틀넥 니트를 입고 오른손에 검은색 신용카드를 쥐어 결제 단말기에 꽂아 결제하고 있는 실사 사진입니다. 왼쪽 앞에는 점원의 손이 디지털 터치스크린 POS 모니터 옆에 보이며, 카운터 위에는 황금색 장식과 화면이 놓여 있고 배경에는 환한 조명과 거울이 있는 넓은 매장이 펼쳐져 있습니다.", "answer": "This is a picture taken at a store checkout counter.\nIn the center, a smiling woman wearing an orange turtleneck sweater is inserting a credit card into the payment terminal to pay.\nOn the left, a cashier is assisting her transaction beside a digital POS touchscreen register.\nOn the counter, a modern payment terminal and decorative items are placed neatly.\nIn the background, the spacious store is brightly illuminated with hanging lights and large mirrors.\nOverall, the customer service interaction seems very pleasant, friendly, and smooth.", "answerTranslation": "이 사진은 매장 계산대 카운터에서 찍힌 사진입니다.\n가운데에는 주황색 터틀넥 스웨터를 입은 미소 띤 여성이 결제하기 위해 신용카드를 결제 단말기에 꽂고 있습니다.\n왼쪽에는 점원이 디지털 POS 터치스크린 계산대 옆에서 그녀의 결제를 돕고 있습니다.\n카운터 위에는 최신 결제 단말기와 장식품들이 깔끔하게 놓여 있습니다.\n배경에는 넓은 매장이 펜던트 조명과 대형 거울들로 밝게 비춰지고 있습니다.\n전반적으로 고객 응대와 서비스가 매우 유쾌하고 친절하며 매끄러워 보입니다.", "magicSentences": ["This is a picture taken at a checkout counter.", "A woman is inserting a credit card into the payment terminal.", "A cashier is assisting her at the POS register.", "Overall, the customer service seems very pleasant and smooth."], "scoreTip": "결제 동작의 핵심: 'inserting a credit card into the payment terminal(카드 단말기에 신용카드 꽂기)'.", "vocabulary": [{"word": "payment terminal", "ipa": "[ˈpeɪmənt ˈtɜːmɪnl]", "pos": "명사구", "meaning": "카드 결제 단말기", "source": "사진 필수"}, {"word": "turtleneck", "ipa": "[ˈtɜːtlnek]", "pos": "명사", "meaning": "목폴라, 터틀넥 스웨터", "source": "사진 필수"}, {"word": "POS register", "ipa": "[piː əʊ es ˈredʒɪstə(r)]", "pos": "명사구", "meaning": "포스기, 전자 계산대", "source": "답변 핵심"}, {"word": "transaction", "ipa": "[trænˈzækʃn]", "pos": "명사", "meaning": "거래, 결제 처리", "source": "답변 핵심"}], "grammarPoints": [{"title": "동작 목적 표현: ~ to pay / to make a payment", "explanation": "inserting a credit card 뒤에 to pay 목적 부정사를 붙여서 동작의 의도를 명확하고 자연스럽게 발화합니다."}]}, {"id": 107, "setId": 7, "setNumber": 7, "qNumber": "Question 3", "questionNumber": "Question 3", "setTitle": "Set 7: Outdoor Fruit & Vegetable Market (청과물 시장 진열대)", "prepTime": 45, "responseTime": 30, "question": "Describe the picture on your screen in as much detail as you can.", "questionTranslation": "화면에 보이는 사진을 가능한 한 자세하게 묘사하세요.", "imageUrl": "https://images.unsplash.com/photo-1488459716781-31db52582fe9?auto=format&fit=crop&w=1200&q=80", "photoScene": {"category": "an outdoor market", "locationEn": "at an outdoor fruit and vegetable market stand", "tags": ["장소: 야외 청과물 시장 (at a fruit and vegetable market)", "전경: 망고스틴, 용과, 패션프루트 등 열대 과일 가득 (tropical fruits with price tags)", "사물: 매장 위에 매달린 원형 금속 저울 (hanging metal scale)", "배경: 층층이 진열된 알록달록한 파프리카와 채소들 (bell peppers and vegetables arranged on tiers)"]}, "photoDescriptionKr": "[청과물 시장 진열대 사진] 화려하고 풍성한 야외 청과물 시장의 진열대 사진입니다. 전경에는 망고스틴, 패션프루트, 람부탄, 용과 등 다양한 신선한 열대 과일들이 이름표(Lichi, Mango)와 함께 수북이 쌓여 있고, 그 바로 위에는 둥근 금속 저울이 매달려 있습니다. 뒤쪽 배경에는 빨갛고 노란 파프리카, 당근, 가지, 호박 등 신선한 채소들이 층층이 먹음직스럽게 진열되어 있습니다.", "answer": "This is a picture taken at an outdoor fruit and vegetable market stand.\nIn the foreground, a rich variety of fresh tropical fruits such as mangosteens, passion fruits, and dragon fruits are piled high with name labels.\nAbove the produce, a round metal weighing scale hangs from the ceiling.\nIn the background, colorful bell peppers, carrots, and pumpkins are beautifully arranged on display tiers.\nOverall, the market stand looks very bountiful, vibrant, and appetizing.", "answerTranslation": "이 사진은 야외 과일 및 채소 시장 가판대에서 찍힌 사진입니다.\n앞쪽에는 망고스틴, 패션프루트, 용과 등 다양하고 신선한 열대 과일들이 이름표와 함께 수북이 쌓여 있습니다.\n농산물 위쪽으로는 둥근 금속 무게 저울이 천장에 매달려 있습니다.\n배경에는 알록달록한 파프리카, 당근, 호박들이 진열대 층에 아름답게 정돈되어 있습니다.\n전반적으로 시장 가판대는 매우 풍성하고, 활기차며, 먹음직스러워 보입니다.", "magicSentences": ["This is a picture taken at a fruit and vegetable market.", "A rich variety of fresh fruits are piled high with labels.", "A metal weighing scale hangs above the produce.", "Overall, the market stand looks very bountiful and vibrant."], "scoreTip": "과일/야채 진열 묘사 시 'piled high(수북이 쌓인)'와 'a rich variety of ~(다양한 종류의)' 표현을 쓰면 어휘력 가산점을 받습니다.", "vocabulary": [{"word": "produce", "ipa": "[ˈprɒdjuːs]", "pos": "명사", "meaning": "(농업) 농산물, 청과물", "source": "사진 필수"}, {"word": "weighing scale", "ipa": "[ˈweɪɪŋ skeɪl]", "pos": "명사구", "meaning": "무게 저울", "source": "사진 필수"}, {"word": "pile high", "ipa": "[paɪl haɪ]", "pos": "동사구", "meaning": "수북이 쌓아 올리다", "source": "답변 핵심"}, {"word": "bountiful", "ipa": "[ˈbaʊntɪfl]", "pos": "형용사", "meaning": "풍성한, 풍부한", "source": "답변 핵심"}], "grammarPoints": [{"title": "동사-주어 도치 구문: Above the produce, a scale hangs", "explanation": "장소 전치사구를 앞세우고 hangs를 써서 시선의 이동을 극대화하는 세련된 묘사 방식입니다."}]}, {"id": 108, "setId": 8, "setNumber": 8, "qNumber": "Question 4", "questionNumber": "Question 4", "setTitle": "Set 8: A Bakery Table (베이커리 갓 구운 곡물빵)", "prepTime": 45, "responseTime": 30, "question": "Describe the picture on your screen in as much detail as you can.", "questionTranslation": "화면에 보이는 사진을 가능한 한 자세하게 묘사하세요.", "imageUrl": "https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=1200&q=80", "photoScene": {"category": "a bakery", "locationEn": "on a wooden table in a bakery", "tags": ["장소: 빵집 작업대 (on a bakery wooden table)", "사물: 갓 구운 둥근 깜파뉴 빵과 곡물 빵 3개 (three freshly baked artisan loaves)", "디테일: 빵 위에 놓인 황금빛 밀 이삭 (golden stalks of wheat)", "배경: 밀가루가 뿌려진 어두운 나무 테이블 (dark wooden surface dusted with flour)"]}, "photoDescriptionKr": "[베이커리 갓 구운 곡물빵 사진] 어두운 나무 테이블 위에 갓 구워낸 3개의 먹음직스러운 곡물 빵이 놓여 있는 정물 사진입니다. 앞쪽에는 흰 밀가루가 자연스럽게 묻어 있는 커다란 둥근 깜파뉴 빵이 있고 그 위에 황금색 밀 이삭 줄기가 얹어져 있습니다. 그 뒤로는 해바라기씨가 겉에 듬뿍 박힌 빵과 오트밀이 뿌려진 빵이 함께 놓여 있으며, 나무 테이블 위에는 밀가루 가루가 솔솔 흩뿌려져 있습니다.", "answer": "This is a picture taken on a bakery wooden table.\nIn the foreground, three freshly baked artisan bread loaves are resting on a dark wooden surface.\nThe round sourdough loaf in the front is lightly dusted with white flour, with a few golden stalks of wheat placed on top.\nBehind it, two other loaves are coated with sunflower seeds and whole grains.\nFlour is sprinkled across the table, adding a rustic bakery atmosphere.\nOverall, the freshly baked bread looks very healthy, delicious, and appetizing.", "answerTranslation": "이 사진은 베이커리의 나무 테이블 위에서 찍힌 사진입니다.\n앞쪽에는 갓 구워낸 3개의 장인 빵 덩어리가 어두운 나무 표면 위에 놓여 있습니다.\n앞에 있는 둥근 사워도우 빵은 흰 밀가루가 가볍게 묻어 있고, 그 위에는 몇 개의 황금빛 밀 이삭이 얹어져 있습니다.\n그 뒤쪽으로는 해바라기씨와 통곡물로 덮인 다른 두 개의 빵이 있습니다.\n테이블 위에 밀가루가 흩뿌려져 있어 소박한 베이커리 분위기를 더해줍니다.\n전반적으로 갓 구운 빵이 매우 건강하고 맛있으며 먹음직스러워 보입니다.", "magicSentences": ["This is a picture taken on a wooden table in a bakery.", "Three freshly baked loaves of bread are resting on the table.", "Flour is sprinkled across the dark wooden surface.", "Overall, the bread looks very delicious and appetizing."], "scoreTip": "베이커리 음식 정물 묘사: 'freshly baked loaves of bread(갓 구운 빵 덩어리)', 'dusted with flour(밀가루가 묻은)'.", "vocabulary": [{"word": "artisan loaf", "ipa": "[ˈɑːtɪzæn ləʊf]", "pos": "명사구", "meaning": "수제 장인 빵 덩어리", "source": "사진 필수"}, {"word": "stalk of wheat", "ipa": "[stɔːk əv wiːt]", "pos": "명사구", "meaning": "밀 이삭, 밀 줄기", "source": "사진 필수"}, {"word": "sunflower seed", "ipa": "[ˈsʌnflaʊə siːd]", "pos": "명사구", "meaning": "해바라기씨", "source": "사진 필수"}, {"word": "rustic", "ipa": "[ˈrʌstɪk]", "pos": "형용사", "meaning": "소박한, 투박하고 정겨운", "source": "답변 핵심"}], "grammarPoints": [{"title": "과거분사 수식: dusted with flour / coated with seeds", "explanation": "사물의 표면 상태를 나타낼 때 'dusted with ~' 또는 'coated with ~'를 분사 형태로 붙여 유창성을 높입니다."}]}, {"id": 109, "setId": 9, "setNumber": 9, "qNumber": "Question 3", "questionNumber": "Question 3", "setTitle": "Set 9: Library Bookshelves (도서관 서가 책장)", "prepTime": 45, "responseTime": 30, "question": "Describe the picture on your screen in as much detail as you can.", "questionTranslation": "화면에 보이는 사진을 가능한 한 자세하게 묘사하세요.", "imageUrl": "https://images.unsplash.com/photo-1521587760476-6c12a4b040da?auto=format&fit=crop&w=1200&q=80", "photoScene": {"category": "a library", "locationEn": "in a classic library or bookstore", "tags": ["장소: 도서관 서가 (in a library or bookstore)", "사물: 높은 나무 책장에 가득 찬 양장본 고서들 (tall wooden bookshelves packed with hardcover books)", "디테일: 선반 번호표 라벨 (shelf numbers 248, 249, 250)", "색상: 주황, 갈색, 파랑 등 다채로운 가죽 책 표지 (colorful leather book covers)"]}, "photoDescriptionKr": "[도서관 서가 책장 사진] 클래식한 도서관 또는 유서 깊은 서점의 거대한 나무 서가 책장 전경 사진입니다. 선반마다 선반 번호(248, 249, 250 등)를 나타내는 황동 번호판이 부착되어 있고, 주황색, 갈색, 파란색, 흰색 등 다양한 색상의 양장본 고서들이 크기별로 빼곡하고 질서정연하게 꽂혀 있습니다.", "answer": "This is a picture taken in a classic library or an old bookstore.\nThe scene features tall wooden bookshelves completely packed with vintage hardcover books.\nThe books are arranged neatly by size and subject, displaying colorful leather spines in orange, brown, and blue.\nAlong the wooden shelves, small plates indicating shelf numbers are visible.\nOverall, the bookshelves convey a scholarly, quiet, and timeless atmosphere.", "answerTranslation": "이 사진은 클래식한 도서관이나 오래된 서점에서 찍힌 사진입니다.\n이 장면은 빈티지 양장본 책들로 완전히 채워진 높은 나무 책장들을 보여줍니다.\n책들은 주황색, 갈색, 파란색의 다채로운 가죽 책등을 뽐내며 크기와 주제별로 깔끔하게 정돈되어 있습니다.\n나무 선반을 따라 선반 번호를 나타내는 작은 번호판들이 보입니다.\n전반적으로 책장들은 학구적이고 조용하며 세월이 흘러도 변치 않는 분위기를 전달합니다.", "magicSentences": ["This is a picture taken in a library.", "Tall wooden bookshelves are packed with vintage books.", "The books are arranged neatly by size and color.", "Overall, the bookshelves convey a scholarly and quiet atmosphere."], "scoreTip": "도서관 서가 묘사: 'completely packed with books(책들로 가득 찬)', 'arranged neatly by size(크기별로 정돈된)'.", "vocabulary": [{"word": "hardcover book", "ipa": "[ˌhɑːdˈkʌvə bʊk]", "pos": "명사구", "meaning": "양장본 책, 하드커버 도서", "source": "사진 필수"}, {"word": "bookshelf", "ipa": "[ˈbʊkʃelf]", "pos": "명사", "meaning": "책장, 서가", "source": "사진 필수"}, {"word": "spine", "ipa": "[spaɪn]", "pos": "명사", "meaning": "(책의) 책등", "source": "답변 핵심"}, {"word": "scholarly", "ipa": "[ˈskɒləli]", "pos": "형용사", "meaning": "학구적인, 학자다운", "source": "답변 핵심"}], "grammarPoints": [{"title": "분사 구문 상태 묘사: displaying colorful leather spines", "explanation": "주절 뒤에 , displaying ~ 분사구를 덧붙여 책등의 다채로운 색상을 세부 묘사하는 고급 문장 구조입니다."}]}, {"id": 110, "setId": 10, "setNumber": 10, "qNumber": "Question 4", "questionNumber": "Question 4", "setTitle": "Set 10: Study Room (스터디룸 대학생 그룹 스터디)", "prepTime": 45, "responseTime": 30, "question": "Describe the picture on your screen in as much detail as you can.", "questionTranslation": "화면에 보이는 사진을 가능한 한 자세하게 묘사하세요.", "imageUrl": "https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=1200&q=80", "photoScene": {"category": "a study room", "locationEn": "in a library study room", "tags": ["장소: 도서관 스터디룸 (in a study room)", "중심 인물: 노트북 화면 보며 크게 웃는 턱수염 남성 (bearded student laughing over a laptop)", "동료들: 모자 착용하고 함께 웃는 친구들 (friends wearing caps smiling together)", "배경: 바인더와 책이 가득 찬 흰색 대형 책장 (white bookshelf full of binders and books)"]}, "photoDescriptionKr": "[스터디룸 대학생 그룹 스터디 사진] 도서관 스터디룸 테이블에서 3~4명의 젊은 대학생들이 모여 노트북을 함께 들여다보며 즐겁게 박장대소하고 있는 사진입니다. 가운데 턱수염을 기른 남성이 테이블 위로 몸을 숙이고 환하게 웃고 있으며, 야구 모자와 헌팅캡을 쓴 친구들도 함께 미소 지으며 화면을 보고 있습니다. 배경의 큰 흰색 책장에는 다양한 바인더와 책들이 가득 꽂혀 있습니다.", "answer": "This is a picture taken in a college library study room.\nIn the center, a group of university students are gathered around a table, laughing cheerfully while looking at a laptop screen.\nA young man with a beard is leaning over the table with a broad smile, sharing a fun moment with his peers.\nNext to him, his friends wearing caps are enjoying the conversation and smiling warmly.\nIn the background, a large white bookshelf is fully stacked with colorful binders and textbooks.\nOverall, the group study atmosphere seems extremely lively, cheerful, and friendly.", "answerTranslation": "이 사진은 대학교 도서관 스터디룸에서 찍힌 사진입니다.\n가운데에는 한 무리의 대학생들이 테이블에 모여 노트북 화면을 보며 유쾌하게 웃고 있습니다.\n턱수염을 기른 한 젊은 남성이 테이블 위로 몸을 기울여 활짝 웃으며 동료들과 즐거운 순간을 나누고 있습니다.\n그 옆에는 모자를 쓴 친구들이 대화를 즐기며 따뜻하게 미소 짓고 있습니다.\n배경에는 커다란 흰색 책장에 다채로운 바인더와 교재들이 가득 꽂혀 있습니다.\n전반적으로 armly through the tree branches.\nOverall, the park presents a peaceful, serene, and refreshing setting for taking a walk.", "answerTranslation": "이 사진은 공원의 경치 좋은 산책로에서 찍힌 사진입니다.\n밝은 햇살 아래 공원 중앙을 가로질러 넓은 자갈길이 곧게 뻗어 있습니다.\n길 양쪽에는 무성한 녹색 잎을 가진 크고 성숙한 나무들이 상쾌한 천연 지붕을 만들고 있습니다.\n오른쪽에는 녹색 잔디밭 위에 빈 금속 공원 벤치가 놓여 있습니다.\n배경에는 황금빛 햇살이 나뭇가지 사이로 따스하게 스며들고 있습니다.\n전반적으로 공원은 산책하기에 평화롭고 고요하며 상쾌한 환경을 제공합니다.", "magicSentences": ["This is a picture taken on a path in a public park.", "A wide gravel path stretches through the center.", "Tall trees with green leaves line both sides of the path.", "Overall, the park presents a peaceful and refreshing setting."], "scoreTip": "공원 풍경 묘사: 'stretches through the center(중앙으로 뻗어 있다)', 'sunlight filters through the trees(나무 사이로 햇살이 스며들다)'.", "vocabulary": [{"word": "gravel path", "ipa": "[ˈɡrævl pɑːθ]", "pos": "명사구", "meaning": "자갈 산책로", "source": "사진 필수"}, {"word": "canopy", "ipa": "[ˈkænəpi]", "pos": "명사", "meaning": "(나뭇가지들이 만드는) 덮개, 천개", "source": "답변 핵심"}, {"word": "filter through", "ipa": "[ˈfɪltə θruː]", "pos": "동사구", "meaning": "(빛이) ~ 사이로 스며들다/비치다", "source": "사진 필수"}, {"word": "serene", "ipa": "[səˈriːn]", "pos": "형용사", "meaning": "고요한, 평화로운", "source": "답변 핵심"}], "grammarPoints": [{"title": "빛과 자연 표현: sunlight filters warmly through ~", "explanation": "filters through 표현은 햇살이 나뭇가지 사이로 비쳐 드는 모습을 묘사할 때 네이티브들이 가장 즐겨 쓰는 감성 표현입니다."}]}, {"id": 114, "setId": 14, "setNumber": 14, "qNumber": "Question 4", "questionNumber": "Question 4", "setTitle": "Set 14: Dogs Running Outdoors (야외 흙길을 달리는 반려견)", "prepTime": 45, "responseTime": 30, "question": "Describe the picture on your screen in as much detail as you can.", "questionTranslation": "화면에 보이는 사진을 가능한 한 자세하게 묘사하세요.", "imageUrl": "https://images.unsplash.com/photo-1548199973-03cce0bbc87b?auto=format&fit=crop&w=1200&q=80", "photoScene": {"category": "outdoor dogs", "locationEn": "on an outdoor dirt trail", "tags": ["장소: 야외 흙길 산책로 (on an outdoor dirt trail)", "왼쪽 반려견: 입 벌리고 신나게 달리는 웰시코기 (happy Welsh Corgi running with ears up)", "오른쪽 반려견: 카메라를 향해 뛰어오는 털 복슬복슬한 소형견 (fluffy terrier running forward)", "배경: 따스한 황혼의 역광 햇살 (warm sunset glow in the background)"]}, "photoDescriptionKr": "[야외 흙길을 달리는 반려견 사진] 따스한 황혼 역광 햇살 아래 야외 흙길을 카메라를 향해 신나게 달려오고 있는 두 마리의 반려견 실사 사진입니다. 왼쪽에는 쫑긋 솟은 귀와 활짝 웃는 표정으로 발을 공중에 띄우며 달리는 귀여운 웰시코기가 있고, 오른쪽 앞에는 털이 복슬복슬한 소형 테리어견이 힘차게 뛰어오고 있습니다.", "answer": "This is a picture taken on an outdoor dirt trail in nature.\nIn the center, two energetic dogs are running happily toward the camera along the path.\nOn the left, a cute Welsh Corgi with pointed ears is smiling with its mouth open, bounding forward with excitement.\nOn the right, a fluffy small terrier is running alongside it with great speed.\nIn the background, warm golden sunlight from the setting sun shines softly over the hills.\nOverall, the scene looks extremely joyful, lively, and full of energy.", "answerTranslation": "이 사진은 자연 속 야외 흙길에서 찍힌 사진입니다.\n가운데에는 활기찬 두 마리의 개가 길을 따라 카메라를 향해 행복하게 달려오고 있습니다.\n왼쪽에는 뾰족한 귀를 가진 귀여운 웰시코기가 입을 벌린 채 미소 지으며 신나게 앞으로 뛰어오르고 있습니다.\n오른쪽에는 털이 복슬복슬한 작은 테리어가 엄청난 속도로 나란히 달리고 있습니다.\n배경에는 지는 해에서 나오는 따뜻한 황금빛 햇살이 언덕 위로 부드럽게 비치고 있습니다.\n전반적으로 이 장면은 매우 즐겁고 활기차며 에너지가 넘쳐 보입니다.", "magicSentences": ["This is a picture taken on an outdoor trail.", "Two energetic dogs are running happily toward the camera.", "A cute dog with pointed ears is bounding forward.", "Overall, the scene looks extremely joyful and lively."], "scoreTip": "동물 묘사: 'running toward the camera(카메라를 향해 달리는)', 'bounding forward with excitement(신나게 뛰어오르는)'.", "vocabulary": [{"word": "dirt trail", "ipa": "[dɜːt treɪl]", "pos": "명사구", "meaning": "흙길 산책로", "source": "사진 필수"}, {"word": "bound forward", "ipa": "[baʊnd ˈfɔːwəd]", "pos": "동사구", "meaning": "앞으로 껑충껑충 뛰어나가다", "source": "답변 핵심"}, {"word": "fluffy", "ipa": "[ˈflʌfi]", "pos": "형용사", "meaning": "털이 복슬복슬한", "source": "사진 필수"}, {"word": "pointed ears", "ipa": "[ˈpɔɪntɪd ɪəz]", "pos": "명사구", "meaning": "쫑긋 선 뾰족한 귀", "source": "사진 필수"}], "grammarPoints": [{"title rapers rise high into the sky.", "A bright round moon is glowing in the evening sky.", "Overall, the skyline presents a breathtaking scenic view."], "scoreTip": "도시 풍경 묘사: 'panoramic city skyline(탁 트인 도시 스카이라인)', 'skyscrapers rise high into the sky(마천루가 하늘 높이 솟아오르다)'.", "vocabulary": [{"word": "skyscraper", "ipa": "[ˈskaɪskreɪpə(r)]", "pos": "명사", "meaning": "초고층 빌딩, 마천루", "source": "사진 필수"}, {"word": "panoramic", "ipa": "[ˌpænəˈræmɪk]", "pos": "형용사", "meaning": "파노라마식의, 한눈에 다 보이는", "source": "답변 핵심"}, {"word": "twilight", "ipa": "[ˈtwaɪlaɪt]", "pos": "명사", "meaning": "황혼, 땅거미", "source": "사진 필수"}, {"word": "breathtaking", "ipa": "[ˈbreθteɪkɪŋ]", "pos": "형용사", "meaning": "숨이 멎을 듯한, 매우 놀라운", "source": "답변 핵심"}], "grammarPoints": [{"title": "동격/추가 수식 분사: including a prominent tower", "explanation": "skyscrapers 뒤에 including을 붙여 특정 상징적인 랜드마크 건물을 구체적으로 지칭하는 고급 문장입니다."}]}, {"id": 116, "setId": 16, "setNumber": 16, "qNumber": "Question 4", "questionNumber": "Question 4", "setTitle": "Set 16: A Bustling Coffee Shop (손님들로 북적이는 카페)", "prepTime": 45, "responseTime": 30, "question": "Describe the picture on your screen in as much detail as you can.", "questionTranslation": "화면에 보이는 사진을 가능한 한 자세하게 묘사하세요.", "imageUrl": "https://images.unsplash.com/photo-1525610553991-2bede1a236e2?auto=format&fit=crop&w=1200&q=80", "photoScene": {"category": "a crowded cafe", "locationEn": "inside a bustling coffee shop", "tags": ["장소: 북적이는 실내 카페 (inside a bustling coffee shop)", "앞쪽 손님: 스마트폰 들고 사진 찍는 여성과 맞은편 남성 (woman holding a smartphone taking a photo)", "카운터: 에스프레소 머신 다루는 바리스타 (barista operating an espresso machine)", "배경: 커피 메뉴 적힌 칠판과 조명들 (chalkboard menus and hanging lights)"]}, "photoDescriptionKr": "[손님들로 북적이는 카페 사진] 활기차고 손님들로 가득한 실내 카페 전경 사진입니다. 앞쪽 테이블에는 긴 머리의 여성이 스마트폰을 들어 사진을 찍고 있고, 그 맞은편에는 안경과 후드티를 입은 남성이 앉아 있습니다. 오른쪽 앞에는 파란 옷을 입은 남성의 옆모습이 보이며, 뒤편 카운터에서는 바리스타가 커피 머신 위 잔들을 정리하고 있습니다. 벽면에는 원두 종류가 적힌 검은 칠판과 찬장이 있고 펜던트 조명들이 켜져 있습니다.", "answer": "This is a picture taken inside a bustling an en sunset illuminates the runway horizon.\nOverall, the airport scene looks very busy, well-coordinated, and cinematic.", "answerTranslation": "이 사진은 터미널 창문을 통해 바라본 공항 활주로 계류장에서 찍힌 사진입니다.\n중앙에는 대형 상용 여객기가 엔진을 정면으로 향한 채 계류장에 주기되어 있습니다.\n항공기 근처에는 반사 안전 조끼를 입은 지상 조업 요원들이 서비스 차량 옆에 서 있습니다.\n오른쪽에는 탑승교가 비행기 출입구에 연결되어 있습니다.\n배경에는 숨이 멎을 듯한 황금빛 석양이 활주로 지평선을 밝히고 있습니다.\n전반적으로 공항 풍경은 매우 분주하고, 잘 조직되어 있으며, 영화의 한 장면처럼 보입니다.", "magicSentences": ["This is a picture taken at an airport tarmac.", "A large commercial airplane is parked on the apron.", "Ground crew wearing safety vests are standing near the aircraft.", "Overall, the scene looks very busy and well-coordinated."], "scoreTip": "공항 사진 빈출 어휘: 'tarmac(활주로 계류장)', 'ground crew(지상 조업 요원)', 'boarding bridge(탑승교)'.", "vocabulary": [{"word": "tarmac", "ipa": "[ˈtɑːmæk]", "pos": "명사", "meaning": "(공항의) 활주로, 계류장", "source": "사진 필수"}, {"word": "ground crew", "ipa": "[ˈɡraʊnd kruː]", "pos": "명사구", "meaning": "지상 조업 직원, 항공 정비 요원", "source": "사진 필수"}, {"word": "boarding bridge", "ipa": "[ˈbɔːdɪŋ brɪdʒ]", "pos": "명사구", "meaning": "탑승교, 탑승 통로", "source": "답변 핵심"}, {"word": "cinematic", "ipa": "[ˌsɪnəˈmætɪk]", "pos": "형용사", "meaning": "영화 같은, 그림 같은", "source": "답변 핵심"}], "grammarPoints": [{"title": "수동 완료 분사: is parked on the apron / is connected to", "explanation": "비행기의 정차 상태와 탑승교의 결합 상태를 수동태 형태로 깔끔하게 설명합니다."}]}, {"id": 119, "setId": 19, "setNumber": 19, "qNumber": "Question 3", "questionNumber": "Question 3", "setTitle": "Set 19: Logistics Warehouse (대형 물류 창고 재고 선반)", "prepTime": 45, "responseTime": 30, "question": "Describe the picture on your screen in as much detail as you can.", "questionTranslation": "화면에 보이는 사진을 가능한 한 자세하게 묘사하세요.", "imageUrl": "https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=1200&q=80", "photoScene": {"category": "a warehouse", "locationEn": "inside a massive logistics warehouse", "tags": ["장소: 대형 물류 창고 (inside a massive warehouse)", "선반: 노란 보관함과 박스로 가득 찬 철제 랙 (metal racks filled with yellow bins and boxes)", "배경: 목재 팔레트에 쌓인 대형 화물들 (packages stacked on wooden pallets)", "구조: 높은 천장과 환기 배관 덕트 (high ceiling with industrial ductwork)"]}, "photoDescriptionKr": "[대형 물류 창고 재고 선반 사진] 거대한 물류 유통 창고의 높은 시점에서 내려다본 사진입니다. 화면 전체를 차지하는 높은 철제 선반 랙마다 노란색 플라스틱 보관 바구니들과 갈색 골판지 상자들이 바둑판처럼 질서정연하게 가득 차 있습니다. 뒤쪽에는 대형 목재 팔레트 위에 화물들이 층층이 적재되어 있으며, 천장에는 은색 환기 배관 파이프와 밝은 공업용 조명이 설치되어 있습니다.", "answer": "This is a picture taken inside a massive logistics and storage warehouse.\nHigh metal shelving racks dominate the entire space, filled with countless yellow storage bins and cardboard boxes.\nThe items are organized in neat rows on multiple tiers for efficient sorting.\nIn the background, taller industrial racks hold wooden pallets stacked with packages ready for shipment.\nAbove, the high ceiling is equipped with industrial ventilation pipes and bright lighting.\nOverall, the warehouse looks extremely well-organized, spacious, and efficient.", "answerTranslation": "이 사진은 거대한 물류 및 보관 창고 실내에서 찍힌 사진입니다.\n높은 철제 선반 랙들이 공간 전체를 지배하고 있으며, 수많은 노란색 보관 바구니와 골판지 상자들로 가득 차 있습니다.\n물품들은 효율적인 분류를 위해 여러 층에 걸쳐 깔끔한 줄로 정돈되어 있습니다.\n배경에는 더 높은 산업용 랙들이 배송 준비가 된 소포들이 쌓인 나무 팔레트들을 지탱하고 있습니다.\n위쪽의 높은 천장에는 산업용 환기 파이프와 밝은 조명이 설치되어 있습니다.\n전반적으로 창고는 매우 잘 정리되어 있고, 넓으며, 효율적으로 보입니다.", "magicSentences": ["This is a picture taken inside a massive warehouse.", "Metal shelving racks are filled with yellow bins and boxes.", "Items are organized in neat rows for efficient sorting.", "Overall, the warehouse looks extremely well-organized and efficient."], "scoreTip": "물류 창고 묘사: 'shelving racks(선반 랙)', 'cardboard boxes(골판지 상자)', 'wooden pallets(나무 팔레트)'.", "vocabulary": [{"word": "cardboard box", "ipa": "[ˈkɑːdbɔːd bɒks]", "pos": "명사구", "meaning": "골판지 상자, 박스", "source": "사진 필수"}, {"word": "wooden pallet", "ipa": "[ˈwʊdn ˈpælət]", "pos": "명사구", "meaning": "나무 팔레트 (화물 받침대)", "source": "사진 필수"}, {"word": "ventilation pipe", "ipa": "[ˌventɪˈleɪʃn paɪp]", "pos": "명사구", "meaning": "환기 배관 파이프", "source": "사진 필수"}, { ion": "'I do this because S+V' (원인 제시) 또는 'It is faster, so I can save time' (원인, so + 결과) 형태로 문장을 매끄럽게 연결하여 복문을 구사하면 130~140점 채점 기준인 '문장 확장력'에서 가산점을 받습니다."}]}, {"id": 11, "setNumber": 4, "setTitle": "Set 4: Movies & Entertainment (영화 & 여가생활)", "questionNumber": "Question 6", "prepTime": 3, "responseTime": 15, "question": "When was the last time you went to a movie theater,\nand what movie did you see?", "questionTranslation": "마지막으로 영화관에 간 것은 언제이고,\n어떤 영화를 보았나요?", "keyPattern": "과거 시점 + 영화 종류 (과거 시제 주의)", "answer": "The last time I went to a movie theater was two weeks ago, and I saw an action movie with my friend.\n\nIt relieved my stress.", "answerTranslation": "마지막으로 영화관에 간 것은 2주 전이었고, 친구와 함께 액션 영화를 보았습니다.\n\n스트레스가 풀렸습니다.", "magicSentences": ["It relieved my stress. (스트레스가 풀렸습니다 - 과거형)"], "scoreTip": "과거 시제 질문이므로 'It relieved my stress'로 과거형 처리를 주의하세요.", "vocabulary": [{"word": "the last time", "ipa": "[ðə lɑːst taɪm]", "pos": "명사구", "meaning": "마지막으로 ~한 때", "source": "문제 필수"}, {"word": "theater", "ipa": "[ˈθɪətə(r)]", "pos": "명사", "meaning": "영화관, 극장", "source": "답변 핵심"}, {"word": "action movie", "ipa": "[ˈækʃn ˈmuːvi]", "pos": "명사구", "meaning": "액션 영화", "source": "답변 핵심"}, {"word": "exciting", "ipa": "[ɪkˈsaɪtɪŋ]", "pos": "형용사", "meaning": "신나는, 흥미진진한", "source": "답변 핵심"}, {"word": "relieved", "ipa": "[rɪˈliːvd]", "pos": "형용사/과거", "meaning": "안도한, 풀린", "source": "답변 핵심"}], "setId": 4, "qNumber": "Question 6", "grammarPoints": [{"title": "구문 핵심: 'The last time S+V was ~'의 주어-동사 구조", "explanation": "‘The last time I ~’ 전체가 문장의 주어(명사구) 역할을 하므로, 뒤에 반드시 본동사 'was'가 와야 완전한 문장이 됩니다. 'about'은 전치사가 아니라 '대략, 약'을 뜻하는 부사이므로, 'was about two weeks ago'처럼 was 뒤에 부사 about과 시간 표현이 이어지는 구조입니다. (was를 빠뜨리고 바로 about을 쓰면 동사가 없어 감점됩니다.)"}, {"title": "시제 일치: 과거 의문문에 대한 과거형 답변", "explanation": "질문에서 'When was the last time ~' 및 'what did you ~'로 과거 시제를 물었으므로, 답변의 동사도 현재형이 아닌 과거형(bought, visited, went 등)과 was로 일치시켜야 합니다."}]}, {"id": 12, "setNumber": 4, "setTitle": "Set 4: Movies & Enter ility", "ipa": "[rɪˌspɒnsəˈbɪləti]", "pos": "명사", "meaning": "책임, 의무", "source": "답변 핵심"}, {"word": "veterinarian (vet)", "ipa": "[ˌvetərɪˈneəriən]", "pos": "명사", "meaning": "수의사, 동물병원", "source": "답변 핵심"}, {"word": "essential", "ipa": "[ɪˈsenʃl]", "pos": "형용사", "meaning": "필수적인, 극히 중요한", "source": "답변 핵심"}, {"word": "healthcare", "ipa": "[ˈhelθkeə(r)]", "pos": "명사", "meaning": "건강 관리", "source": "답변 핵심"}], "setId": 14, "qNumber": "Question 7", "grammarPoints": [{"title": "가정법 및 선호도 표현의 시제 일치 (If I had to ~ I would ~)", "explanation": "가정 상황을 묻는 질문('If you had to ~')에 답할 때는 조건절에 과거동사(had to/could), 주절에 'I would choose / I would prefer' (조동사 과거형 would + 동사원형) 구조를 맞춰주는 것이 정석입니다."}, {"title": "이유 제시 시 First of all, Also, Finally 담화표지어 활용", "explanation": "두 가지 이상의 이유를 말할 때 First of all(우선), Also(또한), Therefore(그러므로)와 같은 담화표지어(Discourse Markers)를 첫머리에 사용하면 논리적 흐름이 명확해져 채점관에게 높은 전달력을 줍니다."}]}, {"id": 43, "setNumber": 15, "setTitle": "Set 15: Recycling & Eco Habits (분리수거 & 친환경)", "questionNumber": "Question 5", "prepTime": 3, "responseTime": 15, "question": "How often do you recycle trash at home,\nand what items do you recycle the most?", "questionTranslation": "얼마나 자주 집에서 쓰레기를 분리수거하고,\n어떤 품목을 가장 많이 배출하나요?", "keyPattern": "빈도 + 품목 공식", "answer": "I recycle trash two or three times a week, and I recycle plastic bottles and cardboard boxes the most.", "answerTranslation": "저는 일주일에 두세 번 쓰레기를 분리수거하고, 플라스틱 병과 종이 박스를 가장 많이 배출합니다.", "magicSentences": ["I recycle plastic bottles and cardboard boxes the most. (플라스틱병과 종이상자를 가장 많이 배출합니다)"], "scoreTip": "분리수거 품목은 'plastic bottles and paper boxes'로 말하세요.", "vocabulary": [{"word": "recycle", "ipa": "[ˌriːˈsaɪkl]", "pos": "동사", "meaning": "재활용하다, 분리수거하다", "source": "답변 핵심"}, {"word": "cardboard box", "ipa": "[ˈkɑːdbɔːd bɒks]", "pos": "명사구", "meaning": "종이 박스", "source": "답변 핵심"}, {"word": "plastic bottle", "ipa": "[ˈplæstɪk ˈbɒtl]", "pos": "명사구", "meaning": "플라스틱 병", "source": "답변 핵심"}, {"word": "separate", "ipa": "[ˈsepəreɪt]", "pos": "동사", "meaning": "분리하다, 분류하다", "source": "답변 핵심"}], "setId": 15, "qNumber": "Question 5", "grammarPoints": [{"title": "빈도부사의 어순 & 현재 시제 사용", "explanation": "평소 습관을 묻는 질문이므로 현재 시제를 사용하며, 빈도부사(usually, often, always)는 일반동사 앞, be동사/조동사 뒤에 위치합니다. (예: I usually read ~, I often go ~)"}, {"title": "접속사 because vs so의 올바른 연결", "explanation": "'I do this because S+V' (원인 제시) 또는 'It is faster, so I can save time' (원인, so + 결과) 형태로 문장을 매끄럽게 연결하여 복문을 구사하면 130~140점 채점 기준인 '문장 확장력'에서 가산점을 받습니다."}]}, {"id": 44, "setNumber": 15, "setTitle": "Set 15: Recycling & Eco Habits (분리수거 & 친환경)", "questionNumber": "Question 6", "prepTime": 3, "responseTime": 15, "question": "Do you use reusable bags when shopping for groceries?\nWhy or why not?", "questionTranslation": "식료품을 쇼핑할 때 다회용 장바구니를 사용하나요?\n왜 그런가요?", "keyPattern": "Yes/No + 돈 절약 & 환경 보호", "answer": "Yes, I always use reusable shopping bags.\n\nBecause it is cheaper so I can save money on plastic bags, and it protects our environment.", "answerTranslation": "네, 저는 항상 장바구니를 사용합니다.\n\n비닐봉지 비용을 아껴 돈을 절약할 수 있고, 환경을 보호하기 때문입니다.", "magicSentences": ["It is cheaper, so I can save money. (더 저렴해서 돈을 절약할 수 있습니다)", "It protects our environment. (우리의 환경을 보호합니다)"], "scoreTip": "장바구니 사용은 'save money'와 'protect environment'를 함께 쓰세요.", "vocabulary": [{"word": "reusable bag", "ipa": "[ˌriːˈjuːzəbl bæɡ]", "pos": "명사구", "meaning": "다회용 장바구니", "source": "답변 핵심"}, {"word": "protect environment", "ipa": "[prəˈtekt ɪnˈvaɪrənmənt]", "pos": "동사구", "meaning": "환경을 보호하다", "source": "답변 핵심"}, {"word": "reduce waste", "ipa": "[rɪˈdjuːs weɪst]", "pos": "동사구", "meaning": "쓰레기를 줄이다", "source": "답변 핵심"}, {"word": "eco-friendly", "ipa": "[ˌiːkəʊ ˈfrendli]", "pos": "형용사", "meaning": "친환경적인", "source": "답변 핵심"}], "setId": 15, "qNumber": "Question 6", "grammarPoints": [{"title": "질문 키워드를 활용한 능동적 주어 전환", "explanation": "질문의 단어를 그대로 활용하여 답변의 주어로 삼으면 어색한 침묵 없이 즉시 발화를 시작할 수 있으며, 주어-동사의 수일치(단수/복수)를 정확하게 유지하는 것이 핵심입니다."}, {"title": "원인과 결과의 so 구문 활용", "explanation": "'[이유], s le": "이유 제시 시 First of all, Also, Finally 담화표지어 활용", "explanation": "두 가지 이상의 이유를 말할 때 First of all(우선), Also(또한), Therefore(그러므로)와 같은 담화표지어(Discourse Markers)를 첫머리에 사용하면 논리적 흐름이 명확해져 채점관에게 높은 전달력을 줍니다."}]}, {"id": 46, "setNumber": 16, "setTitle": "Set 16: Desserts & Bakeries (디저트 & 베이커리)", "questionNumber": "Question 5", "prepTime": 3, "responseTime": 15, "question": "What kind of desserts do you enjoy eating the most,\nand how often do you eat them?", "questionTranslation": "어떤 종류의 디저트를 가장 즐겨 먹고,\n얼마나 자주 드시나요?", "keyPattern": "종류 + 빈도 공식 (기분 전환 만능문장)", "answer": "I enjoy eating chocolate cake the most,\nand I eat it about once or twice a week.\nIt relieves my stress and puts me in a good mood.", "answerTranslation": "저는 초콜릿 케이크를 가장 즐겨 먹고,\n일주일에 한두 번 정도 먹습니다.\n스트레스를 풀어주고 기분을 좋게 만들어 줍니다.", "magicSentences": ["It relieves my stress and puts me in a good mood. (스트레스를 풀어주고 기분을 좋게 해줍니다)"], "scoreTip": "디저트 질문에는 'chocolate cake'나 'ice cream'을 말하고 만능문장 'relieves my stress'를 바로 붙이세요.", "vocabulary": [{"word": "dessert", "ipa": "[dɪˈzɜːt]", "pos": "명사", "meaning": "디저트, 후식", "source": "답변 핵심"}, {"word": "relieve stress", "ipa": "[rɪˈliːv stres]", "pos": "동사구", "meaning": "스트레스를 풀다", "source": "답변 핵심"}, {"word": "good mood", "ipa": "[ɡʊd muːd]", "pos": "명사구", "meaning": "좋은 기분, 상쾌한 상태", "source": "답변 핵심"}, {"word": "sweet", "ipa": "[swiːt]", "pos": "형용사", "meaning": "달콤한, 맛있는", "source": "답변 핵심"}], "setId": 16, "qNumber": "Question 5", "grammarPoints": [{"title": "빈도부사의 어순 & 현재 시제 사용", "explanation": "평소 습관을 묻는 질문이므로 현재 시제를 사용하며, 빈도부사(usually, often, always)는 일반동사 앞, be동사/조동사 뒤에 위치합니다. (예: I usually read ~, I often go ~)"}, {"title": "접속사 because vs so의 올바른 연결", "explanation": "'I do this because S+V' (원인 제시) 또는 'It is faster, so I can save time' (원인, so + 결과) 형태로 문장을 매끄럽게 연결하여 복문을 구사하면 130~140점 채점 기준인 '문장 확장력'에서 가산점을 받습니다."}]}, {"id": 47, "setNumber": 16, "setTitle": "Set 16: Desserts & Bakeries (디저트 & 베이커리)", "questionNumber": "Question 6", "prepTime": 3, "responseTime": 15, "question": "When you buy desserts, do you prefer going to a bakery near your house or ordering online?\nWhy?", "questionTranslation": "디저트를 살 때 집 근처 베이커리에 가는 것을 선호하나요, 아니면 온라인으로 주문하는 것을 선호하나요?\n왜 그런가요?", "keyPattern": "선호도 비교 (시간 절약 & 신선함)", "answer": "I prefer going to a bakery near my house.\nBecause it is close, so it is faster and I can save time.\nAlso, the bread and pastries are very fresh.", "answerTranslation": "저는 집 근처 베이커리에 가는 것을 선호합니다.\n가까워서 더 빠르고 시간을 절약할 수 있기 때문입니다.\n또한 빵과 과자가 매우 신선합니다.", "magicSentences": ["It is close, so it is faster and I can save time. (가까워서 더 빠르고 시간을 절약할 수 있습니다)", "The items are very fresh. (제품이 매우 신선합니다)"], "scoreTip": "집 근처 장소를 고르면 'close to my house' + 'save time' 만능문장으로 15초를 쉽게 채울 수 있습니다.", "vocabulary": [{"word": "online", "ipa": "[ˌɒnˈlaɪn]", "pos": "형용사/부사", "meaning": "온라인의, 인터넷상의", "source": "문제 필수"}, {"word": "prefer", "ipa": "[prɪˈfɜː(r)]", "pos": "동사", "meaning": "선호하다, 더 좋아하다", "source": "문제 필수"}, {"word": "dessert", "ipa": "[dɪˈzɜːt]", "pos": "명사", "meaning": "디저트, 후식", "source": "문제 필수"}, {"word": "bakery", "ipa": "[ˈbeɪkəri]", "pos": "명사", "meaning": "제과점, 빵집", "source": "답변 핵심"}, {"word": "pastry", "ipa": "[ˈpeɪstri]", "pos": "명사", "meaning": "페이스트리, 구운 과자", "source": "답변 핵심"}, {"word": "fresh", "ipa": "[freʃ]", "pos": "형용사", "meaning": "신선한, 갓 구운", "source": "답변 핵심"}, {"word": "save time", "ipa": "[seɪv taɪm]", "pos": "동사구", "meaning": "시간을 아끼다", "source": "답변 핵심"}], "setId": 16, "qNumber": "Question 6", "grammarPoints": [{"title": "가정법 및 선호도 표현의 시제 일치 (If I had to ~ I would ~)", "explanation": "가정 상황을 묻는 질문('If you had to ~')에 답할 때는 조건절에 과거동사(had to/could), 주절에 'I would choose / I would prefer' (조동사 과거형 would + 동사원형) 구조를 맞춰주는 것이 정석입니다."}, {"title": "이유 제시 시 First of all, Also, Finally 담화표지어 활용", "explanation": "두 가지 이상의 이유를 말할 때 First of all(우선), Also(또한), Therefore(그러므로)와 같은 담화표지어(Discourse Markers)를 첫머리에 사용하면 논리적 흐름이 명확해져 채점관에게 높은 전달력을 줍니다."}]}, {"id": 48, "setNumber": 16, "setTitle": "Set 16: Desserts & Ba         { numberTag: '공식 2', topic: '시간 절약 & 바쁜 일상', formulaEn: '"It is faster, so I can save time. I have a busy daily routine."', formulaKo: '더 빨라서 시간을 아낄 수 있습니다. 저는 일상이 바빠요.', extraTip: '온라인 쇼핑, 지하철, 배달 음식, 모바일 뱅킹 단골 템플릿.' },
        { numberTag: '공식 3', topic: '비용 절약 & 빠듯한 예산', formulaEn: '"The price is reasonable, so I can save money. I have a tight budget."', formulaKo: '가격이 합리적이라 돈을 아낄 수 있습니다. 요즘 예산이 빠듯해요.', extraTip: '할인 행사, 대중교통 이용, 도서관, 가성비 제품 질문에 최적.' },
        { numberTag: '공식 4', topic: '유용한 정보 획득 & 후기', formulaEn: '"I can get a lot of useful information on the Internet and social media."', formulaKo: '인터넷과 SNS에서 많은 유용한 정보를 얻을 수 있습니다.', extraTip: '리뷰 읽기, 웹 검색, 스마트폰 앱 사용 질문에 100% 매칭.' },
        { numberTag: '공식 5', topic: '편리함 & 언제 어디서나', formulaEn: '"It is very convenient because I can do it anytime and anywhere."', formulaKo: '언제 어디서나 할 수 있어서 매우 편리합니다.', extraTip: 'OTT, 전자책, 스마트폰, 배송 서비스 질문에 적용.' },
        { numberTag: '공식 6', topic: '친구/가족과의 친목 & 추억', formulaEn: '"I can spend quality time with my friends and make good memories."', formulaKo: '친구들과 소중한 시간을 보내고 좋은 추억을 만들 수 있습니다.', extraTip: '카페, 여행, 콘서트, 맛집 외식 질문에 적용.' }
      ],
      part4: [
        { numberTag: 'Q8 공식', topic: '일정/장소 기본 안내 공식 (Q8 - 15초)', formulaEn: '"The [행사명] will be held on [날짜] at [시간] in [장소]."', formulaKo: '[행사]는 [날짜] [시간]에 [장소]에서 열릴 예정입니다.', extraTip: '전치사 짝꿍: on + 날짜, at + 시간, in + 장소.' },
        { numberTag: 'Q9 공식', topic: '오류 정정 및 취소 통보 공식 (Q9 - 15초)', formulaEn: '"No, actually, that information is not correct. It has been cancelled due to [이유]."', formulaKo: '아니요, 사실 그 정보는 맞지 않습니다. [이유]로 인해 취소되었습니다.', extraTip: '정중한 거절 표현(No, actually) 후 변경/취소 사실 명시 (취소선 확인).' },
        { numberTag: 'Q10 공식', topic: '복수 세션 순차 나열 공식 (Q10 - 30초)', formulaEn: '"Sure, there are two scheduled sessions. First, on [날짜] at [시간], ~ Second, on [날짜] at [시간], ~"', formulaKo: '물론입니다. 2개의 예정된 세션이 있습니다. 첫째로 ~, 둘째로 ~', extraTip: '도입 문장으로 시간을 벌고 First와 Second로 분할하여 안정적으로 30초 채우기.' }
      ]
    };

    function App() {
      const [currentPart, setCurrentPart] = useState('part3');
      const [selectedSetId, setSelectedSetId] = useState('all');
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isAnswerVisible, setIsAnswerVisible] = useState(false);
      const [isExamMode, setIsExamMode] = useState(true);
      const [isCheatSheetOpen, setIsCheatSheetOpen] = useState(false);
      const [modalTab, setModalTab] = useState('part3');
      const [isP4ReadingActive, setIsP4ReadingActive] = useState(false);
      const [p4ReadingTime, setP4ReadingTime] = useState(45);
      const [speakingSentenceIndex, setSpeakingSentenceIndex] = useState(null);

      // 타이머 상태
      const [timerState, setTimerState] = useState({
        phase: 'idle',
        timeLeft: 3,
        totalDuration: 3,
        progressPercent: 0,
        isRunning: false
      });

      // 현재 선택된 파트의 전체 문제 목록
      const rawPartList = useMemo(() => {
        if (currentPart === 'part2') return FULL_DATA.part2 || [];
        if (currentPart === 'part3') return FULL_DATA.part3 || [];
        return FULL_DATA.part4 || [];
      }, [currentPart]);

      // 세트 필터링된 문제 목록
      const filteredQuestions = useMemo(() => {
        if (selectedSetId === 'all') return rawPartList;
        return rawPartList.filter(q => Number(q.setId || q.setNumber) === Number(selectedSetId));
      }, [rawPartList, selectedSetId]);

      // 사용 가능한 세트 번호 목록
      const availableSetIds = useMemo(() => {
        const s = new Set();
        rawPartList.forEach(q => s.add(Number(q.setId || q.setNumber || 1)));
        return Array.from(s).sort((a, b) => a - b);
      }, [rawPartList]);

      const activeQuestion = filteredQuestions[currentIndex] || filteredQuestions[0];

      // 음성 TTS 함수
      const speakText = (text, rate = 1.0, onEndCallback = null) => {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = rate;
        const voices = window.speechSynthesis.getVoices();
        const preferred = voices.find(v => v.name.toLowerCase().includes('daniel')) || voices.find(v => v.lang.startsWith('en'));
        if (preferred) u.voice = preferred;
        u.onend = () => {
          setSpeakingSentenceIndex(null);
          if (onEndCallback) onEndCallback();
        };
        u.onerror = () => setSpeakingSentenceIndex(null);
        window.speechSynthesis.speak(u);
      };

      const handlePartSwitch = (p) => {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        setCurrentPart(p);
        setSelectedSetId('all');
        setCurrentIndex(0);
        setIsAnswerVisible(false);
        setIsP4ReadingActive(false);
        setP4ReadingTime(45);
        const prep = p === 'part2' ? 45 : 3;
        setTimerState({
          phase: 'idle',
          timeLeft: prep,
          totalDuration: prep,
          progressPercent: 0,
          isRunning: false
        });
      };

      const startTimer = () => {
        if (!activeQuestion) return;
        const prep = activeQuestion.prepTime || (currentPart === 'part2' ? 45 : 3);
        setTimerState({
          phase: 'prep',
          timeLeft: prep,
          totalDuration: prep,
          progressPercent: 0,
          isRunning: true
        });
      };

      // 타이머 이펙트
      useEffect(() => {
        let timer = null;
        if (timerState.isRunning && timerState.timeLeft > 0) {
          timer = setInterval(() => {
            setTimerState(prev => {
              const nextTime = prev.timeLeft - 1;
              const pct = ((prev.totalDuration - nextTime) / prev.totalDuration) * 100;
              return { ...prev, timeLeft: nextTime, progressPercent: Math.min(pct, 100) };
            });
          }, 1000);
        } else if (timerState.isRunning && timerState.timeLeft <= 0) {
          if (timerState.phase === 'prep') {
            const resp = activeQuestion?.responseTime || (currentPart === 'part2' ? 30 : 15);
            setTimerState({
              phase: 'response',
              timeLeft: resp,
              totalDuration: resp,
              progressPercent: 0,
              isRunning: true
            });
          } else {
            setTimerState(prev => ({ ...prev, phase: 'finished', isRunning: false, progressPercent: 100 }));
          }
        }
        return () => timer && clearInterval(timer);
      }, [timerState.isRunning, timerState.timeLeft, timerState.phase, activeQuestion, currentPart]);

      // Part 4 표 분석 타이머 이펙트
      useEffect(() => {
        let p4t = null;
        if (isP4ReadingActive && p4ReadingTime > 0) {
          p4t = setInterval(() => setP4ReadingTime(t => t - 1), 1000);
        } else if (isP4ReadingActive && p4ReadingTime <= 0) {
          setIsP4ReadingActive(false);
        }
        return () => p4t && clearInterval(p4t);
      }, [isP4ReadingActive, p4ReadingTime]);

      // [요청 3 반영] 파트 2, 3, 4 모두 정밀 문장 단위 분할
      const structuredSentences = useMemo(() => {
        if (!activeQuestion || !activeQuestion.answer) return [];
        let rawEn = activeQuestion.answer.split('\n').map(s => s.trim()).filter(s => s.length > 0);
        let rawKo = (activeQuestion.answerTranslation || '').split('\n').map(s => s.trim()).filter(s => s.length > 0);

        if (rawEn.length === 1 && rawEn[0].includes('.')) {
          const matchEn = rawEn[0].match(/[^.!?]+[.!?]+(\s+|$)/g);
          if (matchEn && matchEn.length > 1) rawEn = matchEn.map(s => s.trim());
        }
        if (rawKo.length === 1 && rawKo[0].includes('.')) {
          const matchKo = rawKo[0].match(/[^.!?]+[.!?]+(\s+|$)/g);
          if (matchKo && matchKo.length > 1) rawKo = matchKo.map(s => s.trim());
        }

        return rawEn.map((en, idx) => ({
          index: idx + 1,
          en,
          ko: rawKo[idx] || ''
        }));
      }, [activeQuestion]);

      // 키보드 단축키
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
          if (e.key === 'ArrowLeft' && currentIndex > 0) {
            e.preventDefault();
            setCurrentIndex(i => i - 1);
            setIsAnswerVisible(false);
          } else if (e.key === 'ArrowRight' && currentIndex < filteredQuestions.length - 1) {
            e.preventDefault();
            setCurrentIndex(i => i + 1);
            setIsAnswerVisible(false);
          } else if (e.code === 'Space') {
            e.preventDefault();
            setIsAnswerVisible(v => !v);
          } else if (e.key === '1' && activeQuestion) {
            e.preventDefault();
            speakText(activeQuestion.question, 1.0);
          } else if (e.key === '2' && activeQuestion) {
            e.preventDefault();
            speakText(activeQuestion.question, 0.75);
          } else if (e.key === 'Escape') {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            setIsCheatSheetOpen(false);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [currentIndex, filteredQuestions.length, activeQuestion]);

      if (!activeQuestion) return <div className="p-8 text-center font-bold">문제가 없습니다.</div>;

      return (
        <div className="min-h-screen bg-gradient-to-b from-slate-50 via-slate-100 to-slate-200 text-slate-800 antialiased pb-16">
          {/* Ambient Glow */}
          <div className="fixed -top-20 -left-20 w-80 h-80 bg-blue-500/10 rounded-full blur-3xl pointer-events-none -z-10" />
          <div className="fixed top-1/4 -right-20 w-80 h-80 bg-purple-500/10 rounded-full blur-3xl pointer-events-none -z-10" />

          <div className="w-full max-w-5xl mx-auto px-3.5 sm:px-6 lg:px-8 py-5 sm:py-7 flex flex-col gap-5 sm:gap-6">
            
            {/* 1. Bookmark Tabs */}
            <nav className="grid grid-cols-3 gap-2 sm:gap-4">
              <button
                onClick={() => handlePartSwitch('part2')}
                className={`flex items-center justify-center sm:justify-start gap-2 p-3 sm:p-4 rounded-2xl border transition-all ${
                  currentPart === 'part2'
                    ? 'bg-white/95 border-emerald-500 shadow-md ring-2 ring-emerald-500/20 translate-y-[-2px]'
                    : 'bg-white/60 hover:bg-white/90 border-slate-200 text-slate-600'
                }`}
              >
                <span className="text-xl sm:text-2xl">🖼️</span>
                <div className="flex flex-col text-left">
                  <span className={`text-xs sm:text-sm font-bold ${currentPart === 'part2' ? 'text-emerald-700' : 'text-slate-700'}`}>
                    PART 2 책갈피
                  </span>
                  <span className="hidden sm:inline text-xs text-slate-400">고화질 실사 사진 (26세트)</span>
                </div>
              </button>

              <button
                onClick={() => handlePartSwitch('part3')}
                className={`flex items-center justify-center sm:justify-start gap-2 p-3 sm:p-4 rounded-2xl border transition-all ${
                  currentPart === 'part3'
                    ? 'bg-white/95 border-blue-500 shadow-md ring-2 ring-blue-500/20 translate-y-[-2px]'
                    : 'bg-white/60 hover:bg-white/90 border-slate-200 text-slate-600'
                }`}
              >
                <span className="text-xl sm:text-2xl">🔖</span>
                <div className="flex flex-col text-left">
                  <span className={`text-xs sm:text-sm font-bold ${currentPart === 'part3' ? 'text-blue-700' : 'text-slate-700'}`}>
                    PART 3 책갈피
                  </span>
                  <span className="hidden sm:inline text-xs text-slate-400">일상 질문 (48문항/16세트)</span>
                </div>
              </button>

              <button
                onClick={() => handlePartSwitch('part4')}
                className={`flex items-center justify-center sm:justify-start gap-2 p-3 sm:p-4 rounded-2xl border transition-all ${
                  currentPart === 'part4'
                    ? 'bg-white/95 border-purple-500 shadow-md ring-2 ring-purple-500/20 translate-y-[-2px]'
                    : 'bg-white/60 hover:bg-white/90 border-slate-200 text-slate-600'
                }`}
              >
                <span className="text-xl sm:text-2xl">📑</span>
                <div className="flex flex-col text-left">
                  <span className={`text-xs sm:text-sm font-bold ${currentPart === 'part4' ? 'text-purple-700' : 'text-slate-700'}`}>
                    PART 4 책갈피
                  </span>
                  <span className="hidden sm:inline text-xs text-slate-400">표 보고 답하기 (24문항/8세트)</span>
                </div>
              </button>
            </nav>

            {/* 2. Glass Header */}
            <header className="bg-white/80 backdrop-blur-xl border border-white/80 rounded-3xl p-5 sm:p-6 shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div className="flex flex-col gap-1">
                <div className="inline-flex items-center gap-2 bg-blue-50 border border-blue-200 text-blue-600 px-3 py-1 rounded-full text-xs font-semibold w-fit">
                  <span className="w-2 h-2 rounded-full bg-blue-500 animate-pulse" />
                  <span>Target: 120 ~ 140점 (IM3 - IH) · 전체 98개 기출 문항 마스터판</span>
                </div>
                <h1 className="text-xl sm:text-2xl lg:text-3xl font-extrabold tracking-tight text-slate-900 flex items-center gap-2">
                  <span className="bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">TOEIC Speaking</span>
                  <span>{currentPart === 'part2' ? 'Part 2 실전 트레이너' : currentPart === 'part3' ? 'Part 3 실전 트레이너' : 'Part 4 실전 트레이너'}</span>
                </h1>
                <p className="text-xs text-slate-500">
                  {currentPart === 'part2' && '기출 26개 고화질 실사 사진 · 45초 준비 / 30초 답변 · 문장별 개별 발음'}
                  {currentPart === 'part3' && '16개 테마 48개 전 문항 · 한글해석 블라인드 · 문장별 개별 발음'}
                  {currentPart === 'part4' && '8개 세트 24문항 전체 일정표 · 45초 표 분석 · 문의자 발화상황 연계'}
                </p>
              </div>

              <div className="flex items-center gap-2 w-full sm:w-auto">
                <div className="bg-white/90 border border-blue-200 rounded-2xl px-3 py-1.5 flex items-center gap-2 shadow-sm text-xs">
                  <span>👨‍💼</span>
                  <span className="font-bold">Daniel <strong className="text-blue-600 font-normal">(영국식)</strong></span>
                  <button onClick={() => speakText("Hello! Ready to practice every sentence separately?", 1.0)} className="text-[11px] bg-blue-50 text-blue-600 px-2 py-0.5 rounded-full font-bold">
                    ▶️
                  </button>
                </div>
                <button onClick={() => { setModalTab(currentPart); setIsCheatSheetOpen(true); }} className="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-purple-50 text-purple-700 border border-purple-200 active:scale-95 transition-all">
                  🐰 만능족보
                </button>
                <button onClick={() => setIsExamMode(!isExamMode)} className={`px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold border transition-all ${isExamMode ? 'bg-emerald-50 text-emerald-700 border-emerald-300' : 'bg-slate-100 text-slate-400 border-slate-200'}`}>
                  ⏱️ {isExamMode ? 'ON' : 'OFF'}
                </button>
              </div>
            </header>

            {/* 3. Toolbar (세트 셀렉터 + 이전/다음) */}
            <nav className="bg-white/80 backdrop-blur-xl border border-white/80 rounded-2xl p-3 sm:p-4 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center gap-2 w-full sm:w-auto">
                <label className="text-xs sm:text-sm font-bold text-slate-600 whitespace-nowrap">주제 세트:</label>
                <select
                  value={selectedSetId}
                  onChange={(e) => { setSelectedSetId(e.target.value); setCurrentIndex(0); setIsAnswerVisible(false); }}
                  className="flex-1 sm:w-64 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs sm:text-sm font-semibold text-slate-700 outline-none cursor-pointer"
                >
                  <option value="all">전체 세트 (총 {rawPartList.length}문항)</option>
                  {availableSetIds.map(sid => (
                    <option key={sid} value={sid}>Set {sid} 문항</option>
                  ))}
                </select>
              </div>

              <div className="flex items-center justify-between sm:justify-center gap-3 w-full sm:w-auto">
                <div className="flex items-center gap-1.5 text-xs font-mono font-bold text-slate-700 bg-slate-100 px-3 py-1.5 rounded-xl">
                  <span>{currentIndex + 1}</span>
                  <span className="text-slate-400">/</span>
                  <span>{filteredQuestions.length}</span>
                </div>
                <div className="flex gap-1.5">
                  <button
                    onClick={() => { if (currentIndex > 0) { setCurrentIndex(i => i - 1); setIsAnswerVisible(false); } }}
                    disabled={currentIndex === 0}
                    className="px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-white border border-slate-200 disabled:opacity-40 shadow-sm active:scale-95"
                  >
                    ← 이전
                  </button>
                  <button
                    onClick={() => { if (currentIndex < filteredQuestions.length - 1) { setCurrentIndex(i => i + 1); setIsAnswerVisible(false); } }}
                    disabled={currentIndex >= filteredQuestions.length - 1}
                    className="px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-blue-600 text-white shadow-md disabled:opacity-40 active:scale-95"
                  >
                    다음 →
                  </button>
                </div>
              </div>
            </nav>

            {/* 4. Main Practice Card */}
            <main className="bg-white/85 backdrop-blur-2xl border border-white/90 rounded-3xl p-5 sm:p-8 shadow-2xl flex flex-col gap-6">
              
              {/* Meta Pills */}
              <div className="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-100">
                <div className="flex items-center gap-2 flex-wrap">
                  <span className="text-xs font-extrabold px-3 py-1 rounded-full uppercase bg-blue-100 text-blue-800">
                    {currentPart.toUpperCase()}
                  </span>
                  <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-100 text-slate-600">
                    Set {activeQuestion.setId || activeQuestion.setNumber || 1}
                  </span>
                  <span className="text-xs font-bold px-2.5 py-1 rounded-full bg-slate-800 text-white font-mono">
                    {activeQuestion.qNumber || activeQuestion.questionNumber}
                  </span>
                  <span className="text-xs font-bold px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
                    답변 {activeQuestion.responseTime}초
                  </span>
                </div>
                {activeQuestion.keyPattern && (
                  <span className="text-xs bg-amber-50 text-amber-800 px-2.5 py-1 rounded-full border border-amber-200 font-semibold">
                    💡 {activeQuestion.keyPattern}
                  </span>
                )}
              </div>

              {/* [요청 1 반영] Part 2 고해상도 실제 시험 사진 뷰어 및 1:1 묘사 체크리스트 */}
              {currentPart === 'part2' && activeQuestion.imageUrl && (
                <div className="border border-slate-200 rounded-2xl overflow-hidden bg-slate-900/5 shadow-inner flex flex-col">
                  <div className="bg-slate-100 px-4 py-2 border-b border-slate-200 flex justify-between items-center text-xs font-semibold text-slate-600">
                    <span className="flex items-center gap-1.5 font-bold text-slate-800">📸 EXAM PHOTO SCENE</span>
                    <span className="bg-white px-2 py-0.5 rounded-full border border-slate-200 font-mono text-[11px] text-blue-700">{activeQuestion.photoScene?.locationEn || 'in the scene'}</span>
                  </div>
                  <div className="relative aspect-[16/9] max-h-[440px] bg-slate-900/10 flex items-center justify-center overflow-hidden">
                    <img
                      src={activeQuestion.imageUrl}
                      alt="Part 2 Realistic Photo"
                      className="w-full h-full object-cover transition-transform duration-500 hover:scale-[1.02]"
                    />
                    <div className="absolute bottom-2 right-2 bg-black/60 backdrop-blur-md text-white text-[10px] sm:text-xs px-2.5 py-1 rounded-md font-mono">
                      TOEIC Speaking Realistic Photo (Q3~Q4)
                    </div>
                  </div>

                  {/* 1:1 사진 상황 해설 및 핵심 묘사 키포인트 태그 */}
                  {activeQuestion.photoDescriptionKr && (
                    <div className="bg-white p-3.5 sm:p-4 border-t border-slate-200 flex flex-col gap-2.5">
                      <div className="flex items-start gap-2 text-xs sm:text-sm text-slate-700 leading-relaxed bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <span className="text-base shrink-0">🔍</span>
                        <div>
                          <strong className="text-slate-900 font-bold block mb-0.5">사진 1:1 상황 팩트 해설:</strong>
                          <p className="text-slate-600 font-medium">{activeQuestion.photoDescriptionKr}</p>
                        </div>
                      </div>

                      {activeQuestion.photoScene?.tags && activeQuestion.photoScene.tags.length > 0 && (
                        <div className="flex flex-wrap gap-1.5 pt-1">
                          {activeQuestion.photoScene.tags.map((t, ti) => (
                            <span key={ti} className="text-[11px] sm:text-xs bg-emerald-50 text-emerald-800 border border-emerald-200 px-2.5 py-1 rounded-lg font-medium">
                              ✓ {t}
                            </span>
                          ))}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              )}

              {/* [요청 2 반영] Part 4 동적 컬럼 표 & 전체 일정표 + 전화 문의자 발화상황 완벽 복원 */}
              {currentPart === 'part4' && activeQuestion.scheduleTable && (
                <div className="border border-slate-200 rounded-2xl overflow-hidden shadow-sm flex flex-col gap-0">
                  <div className="bg-slate-800 text-white p-4 flex justify-between items-center">
                    <div>
                      <span className="text-[10px] text-blue-400 font-bold uppercase tracking-wider">Reference Schedule Table</span>
                      <h4 className="text-sm sm:text-base font-bold mt-0.5">{activeQuestion.scheduleTable.headerTitle || activeQuestion.setTitle}</h4>
                      {activeQuestion.scheduleTable.metaInfo && activeQuestion.scheduleTable.metaInfo.length > 0 && (
                        <div className="flex flex-wrap gap-2 mt-1.5">
                          {activeQuestion.scheduleTable.metaInfo.map((m, mi) => (
                            <span key={mi} className="text-[11px] bg-white/10 px-2 py-0.5 rounded">
                              <strong>{m.label}:</strong> {m.value}
                            </span>
                          ))}
                        </div>
                      )}
                    </div>
                    <button
                      onClick={() => { setP4ReadingTime(45); setIsP4ReadingActive(!isP4ReadingActive); }}
                      className="px-3 py-1.5 rounded-xl text-xs font-bold bg-white/10 hover:bg-white/20 text-white border border-white/20 shrink-0"
                    >
                      ⏱️ {isP4ReadingActive ? `남은 시간: ${p4ReadingTime}초` : '45초 읽기'}
                    </button>
                  </div>

                  {/* 동적 컬럼 테이블 (모든 세트의 컬럼 누락 방지) */}
                  <div className="overflow-x-auto bg-white">
                    {(() => {
                      const rows = activeQuestion.scheduleTable.rows || [];
                      const colKeys = rows.length > 0 ? Object.keys(rows[0]).filter(k => k !== 'isCancelled') : ['time', 'event', 'location'];
                      return (
                        <table className="w-full text-left text-xs sm:text-sm border-collapse">
                          <thead className="bg-slate-100 border-b border-slate-200 text-slate-600">
                            <tr>
                              {colKeys.map(k => (
                                <th key={k} className="p-3 uppercase font-bold text-[11px]">{k}</th>
                              ))}
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100">
                            {rows.map((r, ri) => {
                              const isCancelled = Boolean(r.isCancelled || (r.activity && String(r.activity).includes('CANCEL')) || (r.status && String(r.status).includes('CANCEL')));
                              return (
                                <tr key={ri} className={isCancelled ? 'line-through text-slate-400 bg-rose-50/40' : 'hover:bg-slate-50'}>
                                  {colKeys.map(k => (
                                    <td key={k} className={`p-3 ${k === 'time' ? 'font-mono' : k === 'event' || k === 'topic' || k === 'program' ? 'font-bold text-blue-900' : ''}`}>
                                      {String(r[k] || '')}
                                    </td>
                                  ))}
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      );
                    })()}
                  </div>

                  {/* 전화 문의자 발화 상황 배너 */}
                  {activeQuestion.context && (
                    <div className="bg-amber-50/80 border-t border-amber-200 p-3.5 flex items-start gap-3">
                      <span className="text-lg">📞</span>
                      <div className="flex flex-col text-xs sm:text-sm">
                        <span className="font-bold text-amber-900">전화 문의자 / 발화 상황:</span>
                        <p className="text-amber-800 italic mt-0.5 font-medium">{activeQuestion.context}</p>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* Question Text Box */}
              <div className="flex flex-col gap-2">
                <div className="flex justify-between items-center">
                  <span className="text-xs font-black text-blue-600 tracking-wider uppercase">QUESTION</span>
                  <div className="flex gap-1.5">
                    <button onClick={() => speakText(activeQuestion.question, 1.0)} className="text-xs font-bold px-3 py-1 bg-white border border-slate-200 rounded-full hover:bg-blue-50 shadow-sm">
                      🔊 1.0x
                    </button>
                    <button onClick={() => speakText(activeQuestion.question, 0.75)} className="text-xs font-bold px-3 py-1 bg-white border border-slate-200 rounded-full hover:bg-amber-50 shadow-sm">
                      🐢 0.75x
                    </button>
                  </div>
                </div>
                <div className="bg-slate-50 border-l-4 border-blue-600 rounded-2xl p-4 sm:p-6 text-slate-900 font-semibold text-base sm:text-lg lg:text-xl leading-relaxed whitespace-pre-line shadow-inner">
                  {activeQuestion.question}
                </div>
              </div>

              {/* Timer Bar */}
              {isExamMode && (
                <div className="bg-slate-50 border border-slate-200 rounded-2xl p-4 flex flex-col gap-2.5">
                  <div className="flex justify-between items-center">
                    <span className="text-xs font-extrabold uppercase px-2.5 py-0.5 rounded-full bg-slate-200 text-slate-700">
                      {timerState.phase === 'prep' ? '⏳ 준비 시간' : timerState.phase === 'response' ? '🎙️ 답변 시간' : '대기 중'}
                    </span>
                    <span className="text-2xl font-black font-mono text-blue-600">{timerState.timeLeft}s</span>
                  </div>
                  <div className="w-full h-2.5 bg-slate-200 rounded-full overflow-hidden">
                    <div className={`h-full transition-all ${timerState.phase === 'response' ? 'bg-emerald-500' : 'bg-amber-500'}`} style={{ width: `${timerState.progressPercent}%` }} />
                  </div>
                  <button onClick={startTimer} disabled={timerState.isRunning} className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs sm:text-sm font-bold shadow-md disabled:opacity-50 active:scale-98 transition-all">
                    ▶️ 실전 카운트다운 시작
                  </button>
                </div>
              )}

              {/* Center Toggle Button */}
              <div className="flex justify-center">
                <button
                  onClick={() => setIsAnswerVisible(!isAnswerVisible)}
                  className="w-full sm:w-auto px-6 py-3 rounded-2xl text-xs sm:text-sm font-extrabold bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 text-white shadow-lg active:scale-95 transition-all"
                >
                  {isAnswerVisible ? '🙈 모범답안 & 문제해석 접기' : '👁️ 모범답안 & 한국어 상세해설 보기 (Space)'}
                </button>
              </div>

              {/* Model Answer Drawer */}
              {isAnswerVisible && (
                <div className="flex flex-col gap-4 pt-4 border-t border-slate-200 animate-fadeIn">
                  {/* Korean Translation */}
                  <div className="bg-blue-50/80 border border-blue-200 rounded-2xl p-4 text-xs sm:text-sm text-blue-950 whitespace-pre-line leading-relaxed">
                    <span className="font-bold block mb-1 text-blue-900">💡 질문 한국어 상세 해설:</span>
                    {activeQuestion.questionTranslation}
                    {activeQuestion.context_kr && (
                      <div className="mt-2 pt-2 border-t border-blue-200 text-xs text-blue-800">
                        <strong>📞 전화 문의자 발화상황 번역:</strong> {activeQuestion.context_kr}
                      </div>
                    )}
                  </div>

                  {/* Model Answer Content Header */}
                  <div className="flex justify-between items-center">
                    <span className="text-xs font-black text-emerald-700 uppercase">MODEL ANSWER</span>
                    <button onClick={() => speakText(activeQuestion.answer, 1.0)} className="text-xs font-bold px-3 py-1 bg-emerald-50 text-emerald-700 border border-emerald-300 rounded-full">
                      🔊 답안 전체 듣기
                    </button>
                  </div>

                  {/* [요청 3 반영] 문장별 분할 뷰어 (파트 2, 3, 4 모두 개별 발음 버튼 제공) */}
                  <div className="flex flex-col gap-2.5">
                    {structuredSentences.map((sent) => (
                      <div
                        key={sent.index}
                        className="bg-slate-50 hover:bg-blue-50/40 border border-slate-200 rounded-2xl p-3.5 sm:p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 transition-colors"
                      >
                        <div className="flex flex-col gap-1 flex-1">
                          {currentPart === 'part2' && (
                            <div className="mb-0.5">
                              <span className="text-[10px] sm:text-[11px] font-extrabold px-2 py-0.5 rounded-md bg-purple-50 text-purple-700 border border-purple-200 inline-block">
                                {sent.index === 0 && '🐰 1단계: 장소 도입 (This is a picture taken in...)'}
                                {sent.index === 1 && '👤 2단계: 중심 인물/피사체 동작 (In the center/foreground...)'}
                                {sent.index === 2 && '🔍 3단계: 세부 사물/주변 인물 (Next to / On the table...)'}
                                {sent.index === 3 && (structuredSentences.length > 4 ? '🏙️ 3단계: 배경/환경 (In the background...)' : '✨ 4단계: 마무리 및 총평 (Overall, it seems...')}
                                {sent.index >= 4 && '✨ 4단계: 마무리 및 총평 (Overall, it seems...)'}
                              </span>
                            </div>
                          )}
                          <span className="text-xs sm:text-sm font-semibold text-slate-900 leading-relaxed">
                            {sent.en}
                          </span>
                          <span className="text-xs text-slate-500 font-medium">
                            {sent.ko}
                          </span>
                        </div>
                        <button
                          onClick={() => {
                            setSpeakingSentenceIndex(sent.index);
                            speakText(sent.en, 1.0, () => setSpeakingSentenceIndex(null));
                          }}
                          className={`inline-flex items-center gap-1 text-xs font-bold px-3 py-1.5 rounded-full border transition-all shrink-0 ${
                            speakingSentenceIndex === sent.index
                              ? 'bg-blue-600 text-white border-blue-600 animate-pulse'
                              : 'bg-white text-slate-700 border-slate-200 hover:border-blue-400 hover:text-blue-600 shadow-sm active:scale-95'
                          }`}
                          title="이 문장만 개별 발음 듣기"
                        >
                          <span>🔊</span>
                          <span>문장듣기</span>
                        </button>
                      </div>
                    ))}
                  </div>

                  {/* [요청 3 반영: 시계토끼 핵심문장 보라색 카드는 해설에서 완전히 제거됨] */}

                  {/* Vocabulary Chips */}
                  {activeQuestion.vocabulary && activeQuestion.vocabulary.length > 0 && (
                    <div className="bg-white border border-slate-200 rounded-2xl p-4">
                      <span className="text-xs font-bold block mb-2">📖 핵심 어휘 (클릭 시 원어민 발음 재생)</span>
                      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">
                        {activeQuestion.vocabulary.map((v, i) => (
                          <div key={i} onClick={() => speakText(v.word, 0.9)} className="bg-slate-50 hover:bg-blue-50 p-2.5 rounded-xl border border-slate-200 flex justify-between items-center cursor-pointer text-xs">
                            <div>
                              <strong className="text-slate-800">{v.word}</strong> <span className="text-slate-400 font-mono">{v.ipa}</span>
                              <div className="text-[11px] text-slate-500">{v.meaning}</div>
                            </div>
                            <span className="text-slate-400">🔊</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* Grammar Points */}
                  {activeQuestion.grammarPoints && activeQuestion.grammarPoints.length > 0 && (
                    <div className="bg-amber-50/70 border border-amber-200 rounded-2xl p-4 text-xs">
                      <span className="font-extrabold text-amber-900 block mb-1.5">💡 핵심 문법 및 구문 분석:</span>
                      <div className="flex flex-col gap-2">
                        {activeQuestion.grammarPoints.map((g, gIdx) => (
                          <div key={gIdx} className="bg-white/80 p-2.5 rounded-xl border border-amber-200/50">
                            <strong className="text-amber-900 block">{g.title}</strong>
                            <p className="text-slate-700 mt-0.5">{g.explanation}</p>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* Score Tip */}
                  <div className="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 text-xs text-emerald-950">
                    <strong className="text-emerald-900 block mb-0.5">🎯 120~140점 핵심 득점 전략:</strong>
                    {activeQuestion.scoreTip}
                  </div>
                </div>
              )}

            </main>

            {/* Footer */}
            <footer className="text-center text-xs text-slate-500 py-2">
              이번 주 토익스피킹 시험, 침묵 없이 만능문장으로 140점(IH) 달성하세요! 🏆
            </footer>

          </div>

          {/* [요청 3 반영] Modal: 시계토끼 만능문장 종합 족보집 (모든 파트 핵심 공식 총집합) */}
          {isCheatSheetOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl w-full max-w-xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
                <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                  <h3 className="font-extrabold text-sm sm:text-base">🐰 시계토끼 만능문장 종합 족보집 (모든 파트 공식 집대성)</h3>
                  <button onClick={() => setIsCheatSheetOpen(false)} className="w-7 h-7 rounded-full bg-slate-200 text-xs font-bold">✕</button>
                </div>
                <div className="flex border-b border-slate-200 text-xs font-bold">
                  <button onClick={() => setModalTab('part2')} className={`flex-1 py-2.5 border-b-2 ${modalTab === 'part2' ? 'border-emerald-600 text-emerald-700 bg-emerald-50' : 'text-slate-500'}`}>Part 2 4단계 공식</button>
                  <button onClick={() => setModalTab('part3')} className={`flex-1 py-2.5 border-b-2 ${modalTab === 'part3' ? 'border-blue-600 text-blue-700 bg-blue-50' : 'text-slate-500'}`}>Part 3 7대 만능문장</button>
                  <button onClick={() => setModalTab('part4')} className={`flex-1 py-2.5 border-b-2 ${modalTab === 'part4' ? 'border-purple-600 text-purple-700 bg-purple-50' : 'text-slate-500'}`}>Part 4 Q8~Q10 응답 족보</button>
                </div>
                <div className="p-4 overflow-y-auto flex flex-col gap-2.5 text-xs">
                  {CHEAT_FORMULAS[modalTab].map((f, i) => (
                    <div key={i} className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                      <div className="flex justify-between items-center">
                        <span className="font-bold text-blue-600">{f.topic}</span>
                        <span className="font-mono text-[10px] bg-slate-200 px-2 py-0.5 rounded font-bold">{f.numberTag}</span>
                      </div>
                      <p className="font-mono font-bold text-slate-900 mt-1">{f.formulaEn}</p>
                      <p className="text-slate-500 mt-0.5">{f.formulaKo}</p>
                      {f.extraTip && <p className="text-[11px] text-slate-400 mt-1">📌 {f.extraTip}</p>}
                    </div>
                  ))}
                </div>
                <div className="p-3 border-t border-slate-100 bg-slate-50 flex justify-end">
                  <button onClick={() => setIsCheatSheetOpen(false)} className="px-4 py-1.5 bg-slate-800 text-white rounded-xl text-xs font-bold">닫기</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
